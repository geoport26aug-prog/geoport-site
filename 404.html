<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ★このページ自体は検索結果に出さない。ただしリンクは辿ってよい（在庫品へ導くため） -->
<meta name="robots" content="noindex,follow">
<title>お探しのページが見つかりません｜GEOPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#f5f7fa;--dark:#eef2f7;--panel:#ffffff;--border:#e2e8f0;--accent:#1c5fb0;--accent2:#2b74cf;--text:#1a2634;--muted:#5b6b7d;--green:#15803d;--line:#f1f4f8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(180deg,var(--dark),var(--black));border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
.tag{font-size:11px;color:var(--muted);letter-spacing:1px;border-left:1px solid var(--border);padding-left:14px}
main{max-width:820px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:21px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
.lead{color:var(--muted);margin-bottom:6px}
.kata{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;letter-spacing:1px;color:var(--text)}
.sbox{display:flex;gap:8px;margin:24px 0 8px}
.sbox input{flex:1;min-width:0;padding:13px 15px;font-size:16px;font-family:inherit;color:var(--text);background:var(--panel);border:1.2px solid var(--accent);border-radius:9px;outline:none}
.sbox button{padding:0 22px;font-size:14px;font-family:inherit;font-weight:500;color:#fff;background:var(--accent);border:0;border-radius:9px;cursor:pointer}
.sbox button:hover{background:var(--accent2)}
.hint{font-size:11.5px;color:var(--muted)}
h2{font-size:14px;font-weight:700;margin:30px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--border)}
h2 .sub{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px;margin-top:11px}
.item{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;text-decoration:none;color:inherit;transition:.15s}
.item:hover{border-color:var(--accent);transform:translateY(-1px)}
.item img{width:42px;height:42px;object-fit:contain;background:var(--line);border-radius:6px;flex:none}
.item .no{width:42px;height:42px;background:var(--line);border-radius:6px;flex:none}
.item b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:15.5px;letter-spacing:.6px;font-weight:600}
.item span{display:block;font-size:11px;color:var(--muted)}
.item .st{color:var(--green);font-weight:500}
.navlinks{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);font-size:12.5px}
.navlinks a{color:var(--accent);text-decoration:none;margin-right:16px}
.navlinks a:hover{text-decoration:underline}
footer{border-top:1px solid var(--border);padding:22px 20px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}
footer a{color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="/"><svg class="gmark" width="28" height="28" viewBox="0 0 36 36" fill="none" stroke="#7fb0e8" stroke-width="2.3"><circle cx="18" cy="18" r="13"/><ellipse cx="18" cy="18" rx="5.6" ry="13" stroke-width="1.5"/><line x1="5.2" y1="18" x2="30.8" y2="18" stroke-width="1.5"/><line x1="7.5" y1="11.5" x2="28.5" y2="11.5" stroke-width="1.2"/><line x1="7.5" y1="24.5" x2="28.5" y2="24.5" stroke-width="1.2"/></svg>GEO<b>PORT</b></a>
<div class="tag">産業用FA機器</div>
</div></header>

<main>
  <h1 id="head">お探しのページが見つかりません</h1>
  <p class="lead" id="lead">お探しの型番は、現在お取り扱いがありません。</p>
  <p class="lead hidden" id="lead2"></p>

  <form class="sbox" id="sform" action="/" method="get">
    <input id="q" name="q" type="search" placeholder="型番・メーカーで検索（例: 6ES7315 / Fanuc）" autocomplete="off">
    <button type="submit">検索</button>
  </form>

  <section id="near" class="hidden">
    <h2>型番の近い在庫品<span class="sub">在庫のあるものだけを表示しています</span></h2>
    <div class="items" id="nearlist"></div>
  </section>

  <section id="fam" class="hidden">
    <h2 id="famh">同じシリーズの在庫品</h2>
    <div class="items" id="famlist"></div>
  </section>

  <p class="navlinks">
    <a href="/">トップページ</a>
    <a href="/list/">メーカー・シリーズ一覧</a>
    <a id="brandlink" class="hidden" href="/list/">メーカーの一覧</a>
    <a href="/guide.html">サービス案内・保証規定</a>
  </p>
</main>

<footer>GEOPORT株式会社 — FA機器 / 登録番号 T1290001098731<br>
掲載中の在庫品を短納期でお届けします。価格・お見積りはお問い合わせください。<br>
<a href="/list/">メーカー・シリーズ一覧</a> ｜ <a href="/guide.html">サービス案内・保証規定</a> ｜ <a href="/company.html">会社情報</a></footer>

<script>
/* ★消えた型番ページに来た人を受け止めるページ（2026-09-10 S承認）
   GitHub Pages は存在しないURLにこのファイルを返す（アドレス欄は元のURLのまま）。
   そこで、開かれたURLから型番を取り出し、在庫のある「型番の近い品」「同じシリーズの品」を出す。
   ★「後継機種です」とは書かない。書くのは「型番が近い」「同じシリーズ」という事実だけで、
     判断はお客様に委ねる（S決定 2026-09-10。誤った後継の指定は設備が動かない事故になるため）。
   ★在庫のある品しか出さないので、「薦めた先に在庫が無い」ことが構造的に起きない。
   ★Cloudflareの計測タグは載せない。載せると404が「そのページの訪問」として集計され、
     どのページが読まれているかの数字が狂うため。代わりに search_log に notfound として記録する。 */
var SB_URL="https://vprtbkkqqdfidzvfwhzo.supabase.co";
var SB_KEY="sb_publishable_qVTKT3ZOy8RL-5k2M94fVw_iOowUGWy";
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

/* 開かれたURLから型番のスラッグを取り出す。/p/<slug>.html のときだけ */
function slugOf(){
  var m=(location.pathname||"").match(/\/p\/([^\/]+)\.html$/i);
  return m?m[1].toLowerCase():"";
}
var SLUG=slugOf();

/* 在庫の一覧（catalog は公開ビュー。価格は含まれない） */
function ask(qs){
  return fetch(SB_URL+"/rest/v1/catalog?select=article,brand,family,condition,stock,image_url&"+qs,
               {headers:{apikey:SB_KEY}})
    .then(function(r){return r.ok?r.json():[];})
    .catch(function(){return [];});
}
function card(x){
  var img=x.image_url?'<img src="'+esc(x.image_url)+'" alt="" loading="lazy">':'<span class="no"></span>';
  return '<a class="item" href="/p/'+esc(slugify(x.article))+'.html">'+img+
    '<span><b>'+esc(x.article)+'</b>'+
    '<span>'+esc([x.brand,x.family].filter(Boolean).join(" / "))+'</span>'+
    '<span class="st">'+esc(x.condition||"")+'　在庫 '+(x.stock||0)+' 点</span></span></a>';
}
/* gen_pages.py と同じ規則 */
function slugify(a){
  var s=String(a||"").toLowerCase().replace(/[^a-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"");
  return s||"item";
}

/* 探されていた型番を記録する（0件検索と同じ扱い。毎朝の点検メールに出る） */
function logNotFound(q){
  /* ★社内（Sと Claude のブラウザ）の検索は記録しない（2026-09-10 S指示）。印は /?noanalytics=1 で付ける */
  try{ if(localStorage.getItem("gp_noan")) return; }catch(e){}
  try{
    fetch(SB_URL+"/rest/v1/search_log",{method:"POST",keepalive:true,
      headers:{apikey:SB_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},
      body:JSON.stringify({q:String(q).slice(0,60),hits:0,brand:null,page:"notfound"})}).catch(function(){});
  }catch(e){}
}

/* 型番の近い品を探す。長い前方一致から順に短くし、最初に見つかったところで止める */
function findNear(slug){
  var lens=[], n=slug.length, i;
  for(i=n;i>=4;i--){ if(i===n||i===Math.floor(n*0.8)||i===Math.floor(n*0.6)||i===Math.floor(n*0.45)||i===4) lens.push(i); }
  var step=function(k){
    if(k>=lens.length) return Promise.resolve({prefix:"",rows:[]});
    var p=slug.slice(0,lens[k]);
    return ask("article=ilike."+encodeURIComponent(p+"*")+"&order=article.asc&limit=8").then(function(rows){
      return rows.length?{prefix:p,rows:rows}:step(k+1);
    });
  };
  return step(0);
}

(function(){
  /* 検索窓：トップページに ?q= で渡す（トップ側が受け取って検索する） */
  var f=$("sform");
  if(f) f.addEventListener("submit",function(e){
    var v=($("q").value||"").trim();
    if(!v){ e.preventDefault(); return; }
  });

  if(!SLUG){
    $("lead").textContent="お探しのページは、移動または削除された可能性があります。";
    $("lead2").textContent="型番やメーカー名でご検索いただけます。";
    $("lead2").classList.remove("hidden");
    logNotFound((location.pathname||"/").slice(0,60));
    return;
  }

  /* 型番らしきものを見出しに出す（スラッグは小文字なので、実在する型番が見つかればその表記を使う） */
  var shown=SLUG.toUpperCase();
  $("head").innerHTML='<span class="kata">'+esc(shown)+'</span> は現在お取り扱いがありません';
  $("lead").textContent="この型番は、現在在庫がありません。再入荷されましたら再び掲載されます。";
  $("q").value=SLUG;
  logNotFound(SLUG);

  findNear(SLUG).then(function(res){
    if(!res.rows.length){          /* 近い在庫が1件も無いときだけ、検索の案内を出す */
      $("lead2").textContent="型番の一部やメーカー名で、ほかの在庫をご検索いただけます。";
      $("lead2").classList.remove("hidden");
      return;
    }
    /* 完全一致が戻っていたら（在庫が復活した直後など）、その1件を先頭に出す */
    var exact=res.rows.filter(function(x){return slugify(x.article)===SLUG;});
    if(exact.length){
      $("head").innerHTML='<span class="kata">'+esc(exact[0].article)+'</span> の在庫がございます';
      $("lead").textContent="ページの準備中です。下のリンクからご覧いただけます。";
    }
    $("nearlist").innerHTML=res.rows.map(card).join("");
    $("near").classList.remove("hidden");
    /* 検索窓は「結果の出る前方一致」で埋め直す。型番まるごとだと押しても0件になるため */
    if(res.prefix && res.prefix.length>=4) $("q").value=res.prefix;

    /* 同じシリーズ（Family）の在庫品。すでに出したものは除く */
    var top=res.rows[0], fam=top.family||"", brand=top.brand||"";
    if(brand){
      var bl=$("brandlink");
      bl.href="/list/"+slugify(brand)+".html";
      bl.textContent=brand+" の一覧";
      bl.classList.remove("hidden");
    }
    if(!fam) return;
    var have={}; res.rows.forEach(function(x){have[x.article]=1;});
    return ask("family=eq."+encodeURIComponent(fam)+"&brand=eq."+encodeURIComponent(brand)+"&order=article.asc&limit=14")
      .then(function(rows){
        rows=rows.filter(function(x){return !have[x.article];}).slice(0,8);
        if(!rows.length) return;
        $("famh").innerHTML='同じシリーズの在庫品<span class="sub">'+esc([brand,fam].filter(Boolean).join(" "))+'</span>';
        $("famlist").innerHTML=rows.map(card).join("");
        $("fam").classList.remove("hidden");
      });
  });
})();
</script>
</body>
</html>
