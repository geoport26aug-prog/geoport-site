<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GEOPORT 台帳ビュー</title>
<style>
  :root{
    --bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--ink:#1a2230;--ink-soft:#55627a;
    --ink-faint:#8b96ab;--line:#dfe4ec;--accent:#1b3a6b;--accent-soft:#e7edf6;
    --good:#1f7a5a;--warn:#b26a00;--warn-soft:#fbeeda;--crit:#b3341f;--crit-soft:#fbe4de;
    --shadow:0 1px 2px rgba(26,34,48,.06),0 6px 20px rgba(26,34,48,.05);
    --c1:#d63b2f;--c2:#2f6fd6;--c3:#1f9d57;--c4:#7d4fd6;--c5:#d6822f;--c0:#cfd6e2;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e131c;--surface:#172030;--surface-2:#1e293b;--ink:#eaf0f8;--ink-soft:#a7b3c8;
    --ink-faint:#6f7d95;--line:#26324a;--accent:#7da3e0;--accent-soft:#1c2c44;
    --good:#57c79a;--warn:#e0a349;--warn-soft:#33280f;--crit:#f0806a;--crit-soft:#37201c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --c1:#f0806a;--c2:#6aa0f0;--c3:#4fc888;--c4:#a98af0;--c5:#e0a349;--c0:#3a465c;
  }}
  :root[data-theme="light"]{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--ink:#1a2230;--ink-soft:#55627a;--ink-faint:#8b96ab;--line:#dfe4ec;--accent:#1b3a6b;--accent-soft:#e7edf6;--good:#1f7a5a;--warn:#b26a00;--warn-soft:#fbeeda;--crit:#b3341f;--crit-soft:#fbe4de;--shadow:0 1px 2px rgba(26,34,48,.06),0 6px 20px rgba(26,34,48,.05);--c1:#d63b2f;--c2:#2f6fd6;--c3:#1f9d57;--c4:#7d4fd6;--c5:#d6822f;--c0:#cfd6e2;}
  :root[data-theme="dark"]{--bg:#0e131c;--surface:#172030;--surface-2:#1e293b;--ink:#eaf0f8;--ink-soft:#a7b3c8;--ink-faint:#6f7d95;--line:#26324a;--accent:#7da3e0;--accent-soft:#1c2c44;--good:#57c79a;--warn:#e0a349;--warn-soft:#33280f;--crit:#f0806a;--crit-soft:#37201c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--c1:#f0806a;--c2:#6aa0f0;--c3:#4fc888;--c4:#a98af0;--c5:#e0a349;--c0:#3a465c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 56px}
  .tnum{font-variant-numeric:tabular-nums}
  header.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 16px}
  .brand{font-weight:700;letter-spacing:.02em;font-size:15px}.brand span{color:var(--accent)}
  .asof{font-size:12px;color:var(--ink-faint)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .stat{padding:15px 16px}
  .stat .label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:7px}
  .stat .num{font-size:23px;font-weight:800;letter-spacing:-.01em}
  .stat .num .yen{font-size:15px;color:var(--ink-soft);font-weight:700;margin-right:1px}
  .stat .foot{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .profit2{position:absolute;right:16px;top:14px;text-align:right}
  .profit2 .pv{font-size:16px;font-weight:700;color:var(--good);letter-spacing:.01em}
  .profit2 .pl{display:block;font-size:10px;color:var(--ink-faint);font-weight:600;margin-top:1px}
  /* ★利益率（§118・逆ざや検出）。文言は付けず数字だけ。マイナス＝赤、10%未満＝注意色。 */
  .profit2 .pr{display:block;font-size:11px;font-weight:700;margin-top:2px;color:var(--ink-soft)}
  /* ★お届け予定日「予定9/10」（S要望 2026-09-03）。出荷済みで予定日が分かっている品にだけ出る */
  .eta{color:var(--good);font-weight:700}
  /* ★出荷前の「見込み」は確定と区別して控えめに（§133・2026-09-08） */
  .eta.hope{color:var(--ink-soft);font-weight:600}
  .rate{min-width:34px;text-align:right;font-size:11px;font-weight:700;color:var(--ink-faint);padding-left:6px;align-self:center}
  .rate.warn{color:var(--warn)}
  .rate.bad{color:var(--crit);font-size:12px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  h2.sec{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;margin:0 4px 10px;display:flex;align-items:center;gap:8px}
  h2.sec .count{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px}
  .list{padding:4px;margin-bottom:22px}
  /* ★4列目は利益率（§118）。代替品の行は3つしか入れないので、その列は空になる */
  .item{display:grid;grid-template-columns:60px 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:11px}
  .item+.item{border-top:1px solid var(--line)}
  .due{text-align:center;font-size:11px;font-weight:700;border-radius:8px;padding:5px 2px;line-height:1.25}
  .due small{display:block;font-size:9.5px;font-weight:600;opacity:.8}
  .due.n{background:var(--surface-2);color:var(--ink-soft)}
  .due.w{background:var(--warn-soft);color:var(--warn)}
  .due.c{background:var(--crit-soft);color:var(--crit)}
  .mid{min-width:0}
  .kata{font-weight:700;font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  .kata .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-weight:500;font-size:11.5px;color:var(--ink-faint);margin-top:1px}
  .ql{font-weight:700;color:var(--ink-soft)}
  /* ★要判断の箱（§159）：本文は折りたたみ。長い通知でも一覧が崩れないように */
  .more{font-weight:700;color:var(--accent);cursor:pointer}
  /* ★「対応済みらしい」＝送信履歴はあるが確証は無い。消さずに薄く残す（§163） */
  .item.faded{opacity:.5}
  /* ★メールの要点（§165）。見出しの下に、何の件かを1〜2行で */
  .sum{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
  .wu{font-weight:700;color:var(--ink-soft)}.wu.warn{color:var(--warn)}.wu.bad{color:var(--crit)}
  .detail{white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.55;color:var(--ink-soft);
    background:var(--surface-2);border-radius:9px;padding:9px 10px;margin:7px 0 0;max-height:320px;overflow:auto}
  .sup{font-size:10px;line-height:1;color:var(--ink-faint);flex:none;opacity:.9;font-weight:700}
  .ship{font-size:12px;line-height:1;flex:none;color:var(--c0)}
  .ship.c1{color:var(--c1)}.ship.c2{color:var(--c2)}.ship.c3{color:var(--c3)}.ship.c4{color:var(--c4)}.ship.c5{color:var(--c5)}
  .ship.inc{color:var(--ink-soft)}
  /* ★eBay等（色スロットを使わない仕入先）で出荷済みのとき、仕入先の印を赤くする（2026-09-02 S要望）。
     色分けは要らないが「もう出荷されたか」は一目で知りたい、という運用のため。 */
  .sup.shipped{color:var(--c1);font-weight:700}
  .trk{font-size:10.5px;color:var(--ink-faint);text-decoration:none;letter-spacing:.02em}
  .trk:active{color:var(--accent)}
  .qty{text-align:right;font-weight:700;font-size:15px}
  .qty small{font-size:11px;color:var(--ink-faint);font-weight:600;margin-left:1px}
  .trend{padding:18px 18px 16px;margin-bottom:8px}
  /* ★棒を描く場所(.plot)を文字と切り離す（2026-09-15・§155）。
     以前は .bar（高さ130px固定）の中に「金額・率・棒・月名」を縦に並べ、棒だけ height:◯% としていた。
     文字とスペースを取り合うため**長い棒ほど押し縮められ**、8月(67%)・9月(69%)が6月(100%)と同じ長さに見えていた。
     → 棒の領域を96pxに固定し、棒の高さはpxで決める（縮まない＝数字どおりの長さになる）。 */
  .bars{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end}
  .bar .plot{width:100%;height:96px;display:flex;align-items:flex-end}
  .bar .col{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,transparent));min-height:3px;flex:0 0 auto}
  .bar.cur .col{background:linear-gradient(180deg,var(--good),color-mix(in srgb,var(--good) 65%,transparent))}
  .bar .v{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .bar .r{font-size:10px;font-weight:700;color:var(--ink-faint);margin-top:-4px}
  .bar .r.warn{color:var(--warn)} .bar .r.bad{color:var(--crit)}
  .bar .m{font-size:11.5px;font-weight:600;color:var(--ink-faint)}.bar.cur .m{color:var(--good)}
  .note{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin:2px 6px 0;padding-top:14px;border-top:1px dashed var(--line)}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .gate .box{width:100%;max-width:320px;text-align:center}
  .gate h1{font-size:17px;margin:0 0 4px}.gate p{font-size:13px;color:var(--ink-faint);margin:0 0 18px}
  .gate input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:center;letter-spacing:.1em}
  .gate button{width:100%;margin-top:10px;font-size:15px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff}
  .gate .err{color:var(--crit);font-size:12.5px;margin-top:10px;min-height:16px}
  .hidden{display:none}
  .loading{padding:60px 0;text-align:center;color:var(--ink-faint);font-size:13px}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="box">
      <h1>GEOPORT 台帳ビュー</h1>
      <p>合言葉を入力してください</p>
      <input id="pass" type="password" inputmode="text" autocomplete="off" autofocus>
      <button id="go">ひらく</button>
      <div class="err" id="err"></div>
    </div>
  </div>

  <div class="wrap hidden" id="app">
    <header class="top">
      <div class="brand">GEOPORT <span>台帳ビュー</span></div>
      <div class="asof tnum" id="asof"></div>
    </header>
    <div class="loading" id="loading">読み込み中…</div>
    <div id="content" class="hidden">
      <!-- ★要判断の箱（§159）＝「今日、決めること」。0件のときは丸ごと隠す。 -->
      <div id="todoWrap" class="hidden">
        <h2 class="sec">要判断の箱 <span class="count" id="todoBadge"></span></h2>
        <div class="card list" id="todoList"></div>
      </div>

      <h2 class="sec">未納品リスト <span class="count" id="unBadge"></span></h2>
      <div class="card list" id="unList"></div>

      <h2 class="sec">今月のまとめ</h2>
      <div class="card stat" style="position:relative;margin-bottom:12px">
        <div class="label"><span class="month" id="mlabel"></span>に受けた注文</div>
        <div class="num tnum" id="oTotal"></div>
        <div class="foot tnum"><span id="oCount"></span> ／ 今月の受注</div>
        <div class="profit2"><span class="pv tnum" id="profit"></span><span class="pl tnum" id="profitN"></span><span class="pr tnum" id="profitR"></span></div>
      </div>
      <div class="row2" style="margin-bottom:22px">
        <div class="card stat">
          <div class="label"><span id="mlabel2"></span>の請求見込み</div>
          <div class="num tnum" id="bill"></div>
          <div class="foot">納品・検収が済んだ分</div>
        </div>
        <div class="card stat">
          <div class="label">未納品</div>
          <div class="num tnum" id="unCount"></div>
          <div class="foot tnum" id="unTotal"></div>
        </div>
      </div>

      <h2 class="sec">売上の推移 <span class="count">検収月ベース</span></h2>
      <div class="card trend"><div class="bars" id="bars"></div><p class="note" id="trendNote"></p></div>
    </div>
  </div>

<script>
  // ▼ 受付係（Supabase Edge Function）の場所。ここは秘密ではない（データは合鍵＋合言葉で守る）
  var API = 'https://vprtbkkqqdfidzvfwhzo.supabase.co/functions/v1/nl-dashboard';
  var K = new URLSearchParams(location.search).get('k') || '';

  var yen = function(n){ return '¥' + Number(n).toLocaleString('ja-JP'); };
  var plain = function(n){ return Number(n).toLocaleString('ja-JP'); };
  var supMark = function(s){ return ({Dong:'●',eBay:'e','ヤフオク':'y','その他':'◆'})[s] || '·'; };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function mmdd(iso){ if(!iso) return ''; var p=iso.split('-'); return (+p[1])+'/'+(+p[2]); }
  // ★利益率（§118）。原価が分からなければ空欄。マイナス＝逆ざや（赤）、10%未満＝注意。
  //   文言は付けず数字だけ出す（画面をのぞかれても意味が伝わりにくいように・S案）。
  // ★要判断の箱（§159）＝「今日、決めること」。通知メールは埋もれるので、ここを1日1回見れば足りる形にする。
  //   本文は長いので折りたたみ（見出しを押すと開く）。0件なら丸ごと隠す。
  function renderTodos(list, asof){
    var wrap = document.getElementById('todoWrap');
    var box  = document.getElementById('todoList');
    if(!list.length){ wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    // ★open＝放置中を先に、likely＝対応済みらしいを後ろに薄く（§163）。件数は「放置中」の数を出す。
    var openN = list.filter(function(t){ return (t.status||'open') !== 'likely'; }).length;
    document.getElementById('todoBadge').textContent = openN + '件'
      + (list.length > openN ? '（ほか対応済みらしい' + (list.length - openN) + '件）' : '');
    list = list.slice().sort(function(a,b){
      var ax = (a.status==='likely')?1:0, bx = (b.status==='likely')?1:0;
      return ax - bx || b.id - a.id;
    });
    box.innerHTML = '';
    list.forEach(function(t){
      var el = document.createElement('div'); el.className = 'item' + (t.status==='likely' ? ' faded' : '');
      var mmdd = (t.at||'').slice(5,10).replace('-','/');
      var hhmm = (t.at||'').slice(11,16);
      // ★期日（先方が約束した日）。過ぎていれば赤、当日までなら注意色（§165）
      var wcls = '', wtxt = '';
      if(t.watch){
        var today = (asof || '').slice(0,10);
        wtxt = '期日 ' + t.watch.slice(5).replace('-','/');
        wcls = (t.watch < today) ? ' bad' : ((t.watch === today) ? ' warn' : '');
        if(t.watch < today) wtxt += '（過ぎています）';
      }
      el.innerHTML =
        '<div class="due' + (wcls===' bad' ? ' c' : (wcls===' warn' ? ' w' : ' n')) + ' tnum">' + esc(mmdd) + '<small>' + esc(hhmm) + '</small></div>' +
        '<div class="mid"><div class="kata"><span class="name">' + esc(t.title || t.kind) + '</span></div>' +
          (t.summary ? '<div class="sum">' + esc(t.summary) + '</div>' : '') +
          '<div class="meta">' + (wtxt ? '<span class="wu' + wcls + '">' + esc(wtxt) + '</span> ・ ' : '')
          + (t.status==='likely' && t.why ? '対応済みらしい：' + esc(t.why) + ' ・ ' : '')
          + '<span class="more">くわしく</span></div>' +
          '<pre class="detail hidden"></pre></div>' +
        '<div class="qty tnum">#' + t.id + '</div>';
      var pre = el.querySelector('.detail'); pre.textContent = t.detail || '';
      el.querySelector('.more').addEventListener('click', function(){ pre.classList.toggle('hidden'); });
      box.appendChild(el);
    });
  }
  // 「9月」→9。読めなければ99（並べ替えの最後尾へ）
  function monthNum(s){ var m = String(s||'').match(/(\d+)/); return m ? parseInt(m[1],10) : 99; }
  // 今月(cur)を0として、前後どちらの月かを返す。半年より離れていたら年をまたいだと見なす（§155）
  function monthKey(s, cur){ var d = monthNum(s) - cur; return d > 6 ? d - 12 : (d < -6 ? d + 12 : d); }
  function rateInfo(sell, cost){
    if(cost==null || !(sell>0)) return {cls:'', t:''};
    // 表示は整数％。色は**表示する数字**で決める（9.9%を「10%」と出しつつ注意色…という食い違いを防ぐ）
    var r = Math.round((sell - cost) / sell * 100);
    var cls = r < 0 ? 'bad' : (r < 10 ? 'warn' : '');
    return {cls:cls, t: (r<0?'−':'') + Math.abs(r) + 'p.c'};
  }
  function dueInfo(n){
    if(n===null) return {cls:'n',t:'—'};
    if(n<0)  return {cls:'c',t:(-n)+'日超過'};
    if(n===0)return {cls:'w',t:'今日'};
    if(n<=3) return {cls:'w',t:'あと'+n+'日'};
    return {cls:'n',t:'あと'+n+'日'};
  }

  function render(d){
    document.getElementById('asof').textContent = (d.asof||'').replace(/-/g,'/') + ' 時点';
    renderTodos(d.todos || [], d.asof || '');
    document.getElementById('mlabel').textContent = d.month_label;
    document.getElementById('mlabel2').textContent = d.month_label;
    document.getElementById('oTotal').innerHTML = '<span class="yen">¥</span>' + plain(d.order_total);
    document.getElementById('oCount').textContent = d.order_count + '件';
    document.getElementById('profit').textContent = plain(d.gross_profit);
    document.getElementById('profitN').textContent = d.order_count + ' / ' + d.profit_known_count;
    // 率＝粗利 ÷「原価が判明している注文の売上」。分母を粗利と同じ範囲に揃える（違う範囲で割ると率が実際より低く出る）
    var mr = rateInfo(d.profit_known_total, d.profit_known_total - d.gross_profit);
    var pR = document.getElementById('profitR');
    pR.textContent = mr.t; pR.className = 'pr tnum' + (mr.cls ? ' ' + mr.cls : '');
    document.getElementById('bill').innerHTML = '<span class="yen">¥</span>' + plain(d.billing_forecast);
    document.getElementById('unCount').innerHTML = d.unshipped_count + '<span style="font-size:14px;color:var(--ink-soft)">件</span>';
    document.getElementById('unTotal').textContent = yen(d.unshipped_total) + ' 分';
    var repN = (d.replacements||[]).length;
    document.getElementById('unBadge').textContent = '全' + d.unshipped_count + '件・納期順' + (repN ? '＋代替品'+repN+'件' : '');

    var L = document.getElementById('unList'); L.innerHTML='';
    d.unshipped.forEach(function(x){
      var di = dueInfo(x.days_left);
      // ★の色：Dongの便は色スロット(c1-5)。eBay/ヤフオク等の色なし入荷中は 'inc'（濃いめ＝「入荷中」）。未出荷は既定の薄い★。
      var starCls = x.shipped ? (x.color ? ('c'+x.color) : 'inc') : '';
      // 追跡番号：Dong(色あり)はFedExの追跡ページへリンク。eBay/ヤフオク等は番号を文字表示のみ。
      var trk = x.tracking_no
        ? (x.color
            ? ' ・ <a class="trk" href="https://www.fedex.com/fedextrack/?trknbr='+encodeURIComponent(x.tracking_no)+'" target="_blank" rel="noopener">追跡 '+esc(x.tracking_no)+'</a>'
            : ' ・ <span class="trk">追跡 '+esc(x.tracking_no)+'</span>')
        : '';
      var ql = x.quality ? '<span class="ql">'+esc(x.quality)+'</span> ・ ' : '';
      var acc = x.plan_month ? ' ・ 検収 '+esc(x.plan_month) : ''; // ★予定検収月
      // ★お届け予定日。仕入先から出荷済みで予定日が分かっているときだけ出す（S要望 2026-09-03）
      // 出荷済み＝確定の「予定」、出荷前＝仕入先の事前通知による「見込」（色を分ける）
      var eta = x.eta_date
        ? ' ・ <span class="eta'+(x.shipped?'':' hope')+'">'+(x.shipped?'予定 ':'見込 ')+mmdd(x.eta_date)+'</span>'
        : '';
      var el = document.createElement('div'); el.className='item';
      el.innerHTML =
        '<div class="due '+di.cls+'">'+di.t+'<small>'+mmdd(x.due_date)+'</small></div>'+
        '<div class="mid"><div class="kata">'+
          '<span class="ship '+starCls+'">★</span>'+
          '<span class="sup'+(x.shipped && !x.color ? ' shipped' : '')+'">'+supMark(x.supplier)+'</span>'+
          '<span class="name">'+esc(x.kata)+'</span></div>'+
          '<div class="meta tnum">'+ql+esc(x.item_name)+' ・ 受注 '+mmdd(x.order_date)+eta+acc+trk+'</div></div>'+
        '<div class="qty tnum">'+x.remain_qty+'<small>点</small></div>'+
        (function(){ var ri = rateInfo(x.unit_price, x.cost_jpy);
          return '<div class="rate tnum'+(ri.cls?' '+ri.cls:'')+'">'+ri.t+'</div>'; })();
      L.appendChild(el);
    });

    // 代替品（⟲）：不具合の代わりにDongが送る品。便の色つきで検品リストに出す（金額・件数の集計には含めない）。
    (d.replacements||[]).forEach(function(x){
      var starCls = x.color ? ('c'+x.color) : 'inc';
      var trk = x.tracking_no
        ? (x.color
            ? ' ・ <a class="trk" href="https://www.fedex.com/fedextrack/?trknbr='+encodeURIComponent(x.tracking_no)+'" target="_blank" rel="noopener">追跡 '+esc(x.tracking_no)+'</a>'
            : ' ・ <span class="trk">追跡 '+esc(x.tracking_no)+'</span>')
        : '';
      var el = document.createElement('div'); el.className='item';
      el.innerHTML =
        '<div class="due n">代替</div>'+
        '<div class="mid"><div class="kata">'+
          '<span class="ship '+starCls+'">⟲</span>'+
          '<span class="name">'+esc(x.kata)+'</span></div>'+
          '<div class="meta tnum"><span class="ql">代替品</span>'+(x.note?' ・ '+esc(x.note):'')+
            (x.eta_date?' ・ <span class="eta'+(x.color||x.tracking_no?'':' hope')+'">'+((x.color||x.tracking_no)?'予定 ':'見込 ')+mmdd(x.eta_date)+'</span>':'')+trk+'</div></div>'+
        '<div class="qty tnum">'+x.qty+'<small>点</small></div>';
      L.appendChild(el);
    });

    // ★月の順に並べ替える（2026-09-15・§155）。台帳側は「9月」のような文字で持っているため、
    //   そのまま並べると**文字の順**になり「10月」が「5月」より前＝いちばん左に出ていた。
    //   今月からの差で見て、半年より離れていたら年をまたいだと見なす
    //   （12月に1月分＝翌年で右／1月に12月分＝前年で左／9月に10月分＝翌月で右）。請求書の支払期限と同じ考え方。
    var curN = monthNum(d.month_label);
    var trend = d.trend.slice().sort(function(a,b){ return monthKey(a.month,curN) - monthKey(b.month,curN); });
    var max = Math.max.apply(null, trend.map(function(t){return t.amount;}).concat([1]));
    var B = document.getElementById('bars'); B.innerHTML='';
    trend.forEach(function(t){
      var cur = (t.month === d.month_label);
      // ★棒の高さは**px**で決める（.plot=96px）。%だと文字とスペースを取り合って長い棒ほど縮み、
      //   数字どおりの長さにならなかった（実測：8月67%・9月69%が6月100%と同じ高さで表示されていた）。
      var h = Math.max(3, Math.round(t.amount/max*96));
      var m = (t.amount/1000000).toFixed(1);
      var el = document.createElement('div'); el.className='bar'+(cur?' cur':'');
      // 率＝粗利 ÷「原価が判明している分の売上」。売上Mの下に数字だけ出す（§118）
      var tr = rateInfo(t.known_amount, (t.known_amount||0) - (t.gross_profit||0));
      el.innerHTML = '<div class="v tnum">¥'+m+'M</div>'+
        '<div class="r tnum'+(tr.cls?' '+tr.cls:'')+'">'+tr.t+'</div>'+
        '<div class="plot"><div class="col" style="height:'+h+'px"></div></div>'+
        '<div class="m">'+esc(t.month)+'</div>';
      B.appendChild(el);
    });
    document.getElementById('trendNote').innerHTML =
      trend.map(function(t){return esc(t.month)+' '+yen(t.amount);}).join(' ／ ')+
      '<br>※ データは2026年5月途中から。集計途中の月は途中集計です。';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
  }

  function load(pass){
    return fetch(API + '?k=' + encodeURIComponent(K), {
      headers: { 'x-view-pass': encodeURIComponent(pass) }
    }).then(function(r){
      if(r.status===401){ throw new Error('bad'); }
      if(!r.ok){ throw new Error('err'); }
      return r.json();
    });
  }

  function open(){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
  }

  document.getElementById('go').addEventListener('click', submit);
  document.getElementById('pass').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });

  function submit(){
    var p = document.getElementById('pass').value;
    var err = document.getElementById('err'); err.textContent='';
    load(p).then(function(d){
      try{ localStorage.setItem('nlpass', p); }catch(e){}
      open(); render(d);
    }).catch(function(){
      err.textContent = '合言葉が違います';
    });
  }

  // 覚えている合言葉で、そのとき最新のデータに更新する
  function refresh(){
    var saved=''; try{ saved=localStorage.getItem('nlpass')||''; }catch(e){}
    if(saved){ load(saved).then(function(d){ open(); render(d); }).catch(function(){}); }
  }

  // 最初に開いたとき
  refresh();

  // ★ホーム画面アプリを開き直した・別アプリから戻ったとき、自動で最新に更新する
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') refresh();
  });
  window.addEventListener('pageshow', function(e){ if(e.persisted) refresh(); });
</script>
</body>
</html>
