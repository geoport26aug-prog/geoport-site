<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GEOPORT 受注台帳</title>
<!--
  GEOPORT フロー1 — 操作画面「受注デスク」（見た目だけのページ）
  2026-08-30 作成。設計＝構想メモ §A-9

  ★このファイルの中に、お客様の情報も金額も入っていません。
    合鍵(?k=)と合言葉が通ったときだけ、Supabase の order-desk から届きます。
    どのタブを出すかも、届いたデータの role が決めます（ページ側では決めない）。
  ★同じファイルを2つの名前で置きます（Sの分・奥様の分）。中身は同じで構いません。
    出し分けはサーバー側で行うため、奥様のURLでは受注のデータが1バイトも届きません。
-->
<style>
:root{--navy:#1b3a6b;--ink:#212529;--sub:#6c757d;--line:#d0d8e8;--bg:#f5f7fb;--card:#fff;
      --ok:#1a7f4b;--warn:#b26a00;--ng:#b02a2a;--soft:#eef2f9}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:.04em}
header .who{font-size:12px;opacity:.85;margin-left:auto}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:0 0 auto;appearance:none;border:0;background:none;padding:13px 18px;font-size:15px;font-weight:600;
  color:var(--sub);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit}
nav button.on{color:var(--navy);border-bottom-color:var(--navy);background:var(--soft)}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;
  background:var(--navy);color:#fff;font-size:12px;line-height:19px;text-align:center}
nav button:not(.on) .n{background:#adb5bd}
main{padding:16px;max-width:1000px;margin:0 auto 60px}
.pane{display:none} .pane.on{display:block}
h2{font-size:15px;margin:22px 0 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:4px}
h2 .cnt{font-size:12px;color:var(--sub);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:11px}
.card.warnc{border-left:4px solid var(--warn)}
.card.ngc{border-left:4px solid var(--ng)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.co{font-size:16px;font-weight:700}
.no{font-size:12px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
.addr{background:var(--soft);border-radius:6px;padding:9px 11px;margin:9px 0;font-size:14px;line-height:1.65}
.addr .zip{color:var(--sub);font-size:12.5px}
.it{padding:7px 0;border-top:1px dashed var(--line)}
.it:first-of-type{border-top:0}
.kata{font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.sn{font-size:12.5px;color:var(--sub);font-family:ui-monospace,Menlo,monospace}
.meta{font-size:12.5px;color:var(--sub);margin-top:8px}
.btns{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.btn{appearance:none;font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:7px;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.gray{background:#fff;color:var(--sub);border-color:var(--line)}
.btn.dang{background:#fff;color:var(--ng);border-color:#e8b4b4}
.btn[disabled]{opacity:.45;cursor:default}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:11px;background:var(--soft);color:var(--navy);font-weight:600}
.tag.w{background:#fdf3e2;color:var(--warn)} .tag.g{background:#e7f4ec;color:var(--ok)} .tag.r{background:#fbeaea;color:var(--ng)}
.empty{color:var(--sub);font-size:14px;padding:14px;background:#fff;border:1px dashed var(--line);border-radius:9px;margin-bottom:11px}
.note{font-size:12.5px;color:var(--sub);margin:8px 0 0}
table.sum{width:100%;border-collapse:collapse;margin-top:9px;font-size:13.5px}
table.sum td{padding:3px 0} table.sum td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.sum tr.tot td{border-top:1px solid var(--line);font-weight:700;padding-top:6px;color:var(--navy)}
label.f{display:block;font-size:12px;color:var(--sub);font-weight:600;margin:9px 0 3px}
input.f,select.f{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.form{background:var(--soft);border-radius:8px;padding:4px 14px 14px;margin-top:12px}
.form h3{font-size:13px;color:var(--navy);margin:14px 0 0}
.uline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-top:1px dashed var(--line)}
.uline input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.gate .box{width:100%;max-width:320px;text-align:center}
.gate h1{font-size:17px;margin:0 0 4px}.gate p{font-size:13px;color:var(--sub);margin:0 0 18px}
.gate input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-align:center;letter-spacing:.1em}
.gate button{width:100%;margin-top:10px;font-size:15px;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff}
.gate .err{color:var(--ng);font-size:12.5px;margin-top:10px;min-height:16px}
.hidden{display:none}
.loading{padding:60px 0;text-align:center;color:var(--sub);font-size:13px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:92%;background:#212529;color:#fff;
  padding:12px 18px;border-radius:9px;font-size:14px;line-height:1.6;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:#7a1f1f}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h1>GEOPORT 受注台帳</h1>
    <p>合言葉を入力してください</p>
    <input id="pass" type="password" inputmode="text" autocomplete="off" autofocus>
    <button id="go">ひらく</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header><b>GEOPORT 受注台帳</b><span class="who" id="who"></span></header>
  <nav id="nav"></nav>
  <main>
    <div class="loading" id="loading">読み込み中…</div>
    <div id="panes"></div>
  </main>
</div>

<script>
(function(){
"use strict";

// 受付係（Edge Function）の場所。データはここから届く。
var API = "https://vprtbkkqqdfidzvfwhzo.supabase.co/functions/v1/order-desk";
var K = new URLSearchParams(location.search).get("k") || "";
var PASSKEY = "geoport_order_desk_pass";   // 合言葉を覚えておく場所（この端末の中だけ）

var D = null;      // いま画面に出しているデータ
var TAB = null;    // いま開いているタブ
var busy = false;

// ── ちいさな道具 ───────────────────────────────────────────────
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function yen(n){ return "¥" + Number(n||0).toLocaleString("ja-JP"); }
function el(id){ return document.getElementById(id); }
function md(d){ if(!d) return ""; var p=String(d).slice(0,10).split("-"); return p[1]*1+"月"+p[2]*1+"日"; }
function ymd(d){ if(!d) return ""; var p=String(d).slice(0,10).split("-"); return p[0]+"年"+p[1]*1+"月"+p[2]*1+"日"; }
function val(id){ var e=el(id); return e ? e.value.trim() : ""; }

var toastTimer=null;
function toast(msg, bad){
  var t=el("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className = bad ? "bad" : ""; t.textContent = msg; t.style.display="block";
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.style.display="none"; }, bad ? 9000 : 4000);
}

// ── 受付係とのやり取り ─────────────────────────────────────────
function getPass(){ try{ return localStorage.getItem(PASSKEY)||""; }catch(e){ return ""; } }
function load(pass){
  return fetch(API + "?k=" + encodeURIComponent(K), { headers:{ "x-view-pass": encodeURIComponent(pass) } })
    .then(function(r){
      if(r.status===401) throw new Error("bad-pass");
      if(!r.ok) throw new Error("err-" + r.status);
      return r.json();
    });
}
// ボタンを押したとき。★台帳を書き換えるので、返事を必ず確かめて、そのあと画面を作り直す。
function act(body){
  if(busy) return Promise.reject(new Error("busy"));
  busy = true;
  return fetch(API + "?k=" + encodeURIComponent(K), {
    method:"POST",
    headers:{ "x-view-pass": encodeURIComponent(getPass()), "content-type":"application/json" },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
    .then(function(res){
      if(res.status!==200 || res.body.ok===false) throw new Error(res.body && res.body.error ? res.body.error : "うまくいきませんでした");
      return res.body;
    })
    .finally(function(){ busy=false; });
}
function reload(){ return load(getPass()).then(function(d){ D=d; render(); }); }

// ══════════════════════════════════════════════════════════════
//  タブの組み立て
// ══════════════════════════════════════════════════════════════
function tabs(){
  var all = [
    { id:"order",  name:"受注",     s_only:true,  count: D.quotable.length + D.ordered.length },
    { id:"attn",   name:"要対応",   s_only:true,  count: D.attention.length },
    { id:"arrive", name:"到着待ち", s_only:false, count: D.arriving.length },
    { id:"insp",   name:"検品待ち", s_only:false, count: D.inspecting.reduce(function(a,o){return a+o.units.length;},0) },
    { id:"ship",   name:"出荷待ち", s_only:false, count: D.shipping.length }
  ];
  return all.filter(function(t){ return D.role==="s" || !t.s_only; });
}

function render(){
  var ts = tabs();
  if(!TAB || !ts.some(function(t){ return t.id===TAB; })) TAB = ts[0].id;

  el("who").textContent = (D.role==="s" ? "全部ページ" : "出荷ページ") + "／" + ymd(D.today) + " 現在";

  var nav = el("nav"); nav.innerHTML = "";
  ts.forEach(function(t){
    var b = document.createElement("button");
    b.className = (t.id===TAB ? "on" : "");
    b.innerHTML = esc(t.name) + '<span class="n">' + t.count + "</span>";
    b.addEventListener("click", function(){ TAB = t.id; render(); window.scrollTo(0,0); });
    nav.appendChild(b);
  });

  var h = "";
  if(TAB==="order")  h = paneOrder();
  if(TAB==="attn")   h = paneAttention();
  if(TAB==="arrive") h = paneArriving();
  if(TAB==="insp")   h = paneInspect();
  if(TAB==="ship")   h = paneShip();
  el("panes").innerHTML = '<section class="pane on">' + h + "</section>";
  el("loading").classList.add("hidden");
  wire();
}

// ══════════════════════════════════════════════════════════════
//  ① 受注タブ（Sだけ）
// ══════════════════════════════════════════════════════════════
function paneOrder(){
  var h = "";

  // ── 見積を出した先（受注にできる）─────────────────────────
  h += '<h2>見積を出した先（受注にできます）<span class="cnt">' + D.quotable.length + "件</span></h2>";
  if(!D.quotable.length) h += '<div class="empty">いまは、受注にできる見積はありません。</div>';

  D.quotable.forEach(function(q){
    h += '<div class="card' + (q.expired ? " warnc" : "") + '">' +
         '<div class="top"><span class="co">' + esc(q.company) + '</span><span class="no">' + esc(q.quote_no) + "</span></div>";
    q.items.forEach(function(i){
      h += '<div class="it"><span class="kata">' + esc(i.article) + "</span> × " + i.qty +
           '　<span class="sn">' + esc([i.brand, i.condition, "保証" + (i.warranty_years||1) + "年"].filter(Boolean).join("／")) + "</span></div>";
    });
    h += '<table class="sum">' +
         "<tr><td>商品計</td><td>" + yen(q.goods_jpy) + "</td></tr>" +
         "<tr><td>国内送料" + (q.pref ? "（" + esc(q.pref) + "）" : "") + "</td><td>" + yen(q.ship_jpy) + "</td></tr>" +
         "<tr><td>消費税(10%)</td><td>" + yen(q.tax_jpy) + "</td></tr>" +
         '<tr class="tot"><td>合計</td><td>' + yen(q.total_jpy) + "</td></tr></table>";

    if(q.expired){
      h += '<div class="meta"><span class="tag w">有効期限切れ</span> 期限 ' + ymd(q.valid_until) + "（" + (-q.days_left) + "日前）</div>" +
           '<p class="note">為替で価格が動くため、このままでは受注にできません。再見積を出してください。<br>' +
           "どうしてもこの価格で受注する場合は、下のボタンを押すと進めますが、台帳に「期限切れの見積で受注した」と必ず記録が残ります。</p>";
    } else {
      h += '<div class="meta">見積の有効期限：' + ymd(q.valid_until) + "（あと" + q.days_left + "日）</div>";
    }
    h += '<div class="btns"><button class="btn ' + (q.expired ? "gray" : "pri") + '" data-openform="' + q.request_id + '">' +
         (q.expired ? "承知のうえで受注にする" : "受注にする") + "</button></div>" +
         '<div id="form-' + q.request_id + '" class="form hidden"></div></div>';
  });

  // ── 受注済み ─────────────────────────────────────────────
  h += '<h2>受注済み<span class="cnt">' + D.ordered.length + "件</span></h2>";
  if(!D.ordered.length) h += '<div class="empty">まだ受注はありません。</div>';

  D.ordered.forEach(function(o){
    var t = o.totals || {};
    var tagCls = (o.status==="受注"||o.status==="入金待ち") ? "" : "g";
    h += '<div class="card"><div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>";
    (o.order_items||[]).forEach(function(i){
      h += '<div class="it"><span class="kata">' + esc(i.article) + "</span> × " + i.qty +
           '　<span class="sn">' + yen(i.unit_price_jpy) + "／台・保証" + (i.warranty_years||1) + "年</span></div>";
    });
    h += '<div class="meta"><span class="tag ' + tagCls + '">' + esc(o.status) + "</span> 合計 " + yen(t.total_jpy) +
         (o.customer_po_no ? "　先方注番 " + esc(o.customer_po_no) : "") +
         "　" + esc(o.payment_terms||"") +
         (o.paid_on ? '　<span class="tag g">入金 ' + md(o.paid_on) + "</span>" : "") + "</div>";
    if(!o.ship_addr) h += '<p class="note"><span class="tag r">納品先が空</span> 出荷の前に住所を入れてください（いまは注文書を見ながら手で入れます）。</p>';

    var inv = (o.documents||[]).filter(function(x){ return x.kind==="ご請求書"; })[0];
    if(inv){
      h += '<div class="meta"><span class="tag g">ご請求書 発行済み</span> ' + esc(inv.doc_no) + '　' + md(inv.issued_on) +
           '　' + yen(inv.total_jpy) + '　<span class="tag">Gmailの下書きに入っています</span></div>';
    }
    h += '<div class="btns">';
    if(o.status==="受注" && !inv){
      h += '<button class="btn pri" data-invoice="' + o.id + '">ご請求書を作る</button>';
      h += '<button class="btn sec" data-invprev="' + o.id + '">先にPDFを見る</button>';
    }
    if(inv) h += '<button class="btn" data-invoice="' + o.id + '" data-redo="1">ご請求書を作り直す</button>';
    if(o.status==="受注" || o.status==="入金待ち"){
      if(!o.paid_on)           h += '<button class="btn ok" data-mark="' + o.id + '" data-what="入金を確認した">入金を確認した</button>';
      // ★発注メールを送った時点では、JCの発注番号はまだ分からない（S確認 2026-08-30）
      h += '<button class="btn pri" data-mark="' + o.id + '" data-what="JCへ発注メールを送った">JCへ発注メールを送った</button>';
      h += '<button class="btn dang" data-mark="' + o.id + '" data-what="キャンセルする">お客様都合のキャンセル</button>';
    }
    // 番号はインボイスが来てから。発注前でも「先に分かった」なら入れられる
    if(["受注","入金待ち","発注","入荷"].indexOf(o.status)>=0)
      h += '<button class="btn" data-jcform="' + o.id + '">JCの番号を入れる</button>';
    // ★在庫切れは「お客様都合のキャンセル」とは別の道。発注後でも通り、全額返金になる（§A-2①）
    if(["受注","入金待ち","発注","入荷","検品"].indexOf(o.status)>=0)
      h += '<button class="btn dang" data-mark="' + o.id + '" data-what="在庫切れで中止する">在庫切れで中止</button>';
    if(o.status==="出荷")      h += '<button class="btn ok" data-mark="' + o.id + '" data-what="完了にする">完了にする</button>';
    h += "</div>";
    h += '<div id="jc-' + o.id + '" class="form hidden"></div>';
    h += '<div id="iv-' + o.id + '"></div>';
    h += "</div>";
  });

  // ── 中止した受注（返金がまだのものを目立たせる）─────────────────
  var cx = D.cancelled || [];
  if(cx.length){
    h += '<h2>中止した受注<span class="cnt">' + cx.length + "件</span></h2>";
    cx.forEach(function(o){
      var need = o.paid_on && !o.refunded_on;
      h += '<div class="card' + (need ? " ngc" : "") + '">' +
           '<div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>" +
           '<div class="meta"><span class="tag r">中止</span> 合計 ' + yen((o.totals||{}).total_jpy) +
           (o.paid_on ? "　入金 " + md(o.paid_on) : "　入金なし") +
           (o.refunded_on ? '　<span class="tag g">返金 ' + md(o.refunded_on) + "</span>" : "") + "</div>";
      if(need){
        h += '<p class="note">★<b>全額を返金してください。振込手数料も当社負担です</b>（規約どおり）。<br>' +
             "返金の振込が済んだら、下のボタンを押してください。</p>" +
             '<div class="btns"><button class="btn ok" data-mark="' + o.id + '" data-what="返金した">返金した</button></div>';
      }
      h += "</div>";
    });
  }

  if(D.closed && D.closed.length){
    h += '<h2>おわった受注（新しい順に10件）<span class="cnt">' + D.closed.length + "件</span></h2>";
    D.closed.forEach(function(o){
      h += '<div class="card"><div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>" +
           '<div class="meta"><span class="tag">' + esc(o.status) + "</span> 合計 " + yen((o.totals||{}).total_jpy) + "</div></div>";
    });
  }
  return h;
}

// 「受注にする」の入力欄（注文書を見ながら手で入れる。次の段階でPDFから自動で埋まる）
function orderForm(q){
  var f = function(id, label, ph){
    return '<label class="f">' + esc(label) + '</label><input class="f" id="of-' + id + '" value="" placeholder="' + esc(ph||"") + '">';
  };
  var h = '<h3>注文書を読み込む（PDFか、注文書の写真）</h3>' +
    '<p class="note" style="margin:2px 0 0">読み込むと、下の欄が自動で埋まります。<b>そのまま受注にはしません。</b>必ず中身をご確認ください。<br>' +
    '見積と食い違うところがあれば警告を出します。読み取りには20秒ほどかかります。</p>' +
    '<input class="f" type="file" id="pf-' + q.request_id + '" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic" style="padding:7px">' +
    '<div class="btns" style="margin-top:8px"><button class="btn sec" data-readpo="' + q.request_id + '">注文書を読み込む</button></div>' +
    '<div id="pw-' + q.request_id + '"></div>' +
    '<input type="hidden" id="pp-' + q.request_id + '" value="">' +
    '<h3>注文書の内容（読み込んだら埋まります。手で直せます）</h3>' +
    '<div class="grid2">' +

// ══════════════════════════════════════════════════════════════
//  ボタンをつなぐ
// ══════════════════════════════════════════════════════════════
function wire(){
  var root = el("panes");

  // 受注フォームを開く／閉じる
  root.querySelectorAll("[data-openform]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-openform");
      var q = D.quotable.filter(function(x){ return String(x.request_id)===id; })[0];
      var box = el("form-" + id);
      box.innerHTML = orderForm(q); box.classList.remove("hidden"); b.disabled = true;
      wire();
    });
  });
  root.querySelectorAll("[data-closeform]").forEach(function(b){
    b.addEventListener("click", function(){ render(); });
  });

  // 注文書を読み込む（★台帳は変えない。入力欄を埋めるだけ）
  root.querySelectorAll("[data-readpo]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-readpo");
      var inp = el("pf-" + id);
      var file = inp && inp.files && inp.files[0];
      if(!file){ toast("先にファイルを選んでください", true); return; }
      if(file.size > 15*1024*1024){ toast("ファイルが大きすぎます（15MBまで）", true); return; }
      var box = el("pw-" + id);
      b.disabled = true; var was = b.textContent; b.textContent = "読み取り中…（20秒ほど）";
      box.innerHTML = "";

      var fr = new FileReader();
      fr.onerror = function(){ b.disabled=false; b.textContent=was; toast("ファイルを開けませんでした", true); };
      fr.onload = function(){
        var data = String(fr.result); data = data.slice(data.indexOf(",") + 1);
        act({ action:"read_po", request_id:Number(id), media_type:file.type, data:data })
          .then(function(r){
            var f = r.fields || {};
            Object.keys(f).forEach(function(k){
              var e = el("of-" + k); if(e && f[k]) e.value = f[k];
            });
            el("pp-" + id).value = r.po_path || "";
            var extra = [];
            if(f.order_date)         extra.push("注文日：" + esc(f.order_date));
            if(f.desired_delivery)   extra.push("希望納期：" + esc(f.desired_delivery));
            if(f.payment_terms_text) extra.push("お支払い：" + esc(f.payment_terms_text));
            if(f.notes)              extra.push("備考：" + esc(f.notes));
            var html = '<div class="card" style="margin:10px 0 0">' +
              '<div class="meta"><span class="tag g">読み取りました</span> 注文書は台帳に保管されます</div>' +
              (extra.length ? '<p class="note">' + extra.join("<br>") + "</p>" : "");
            (r.warnings || []).forEach(function(w){
              html += '<p class="note" style="color:#b02a2a;font-weight:600">⚠️ ' + esc(w).replace(/\n/g,"<br>") + "</p>";
            });
            if(!(r.warnings||[]).length) html += '<p class="note">見積との食い違いはありませんでした。</p>';
            html += "</div>";
            box.innerHTML = html;
            b.disabled = false; b.textContent = "別の注文書を読み込む";
            toast("読み取りました。中身をご確認ください");
          })
          .catch(function(e){ b.disabled=false; b.textContent=was; toast(e.message, true); });
      };
      fr.readAsDataURL(file);
    });
  });

  // 受注にする
  root.querySelectorAll("[data-docreate]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-docreate"));
      var expired = b.getAttribute("data-expired")==="1";
      var q = D.quotable.filter(function(x){ return x.request_id===id; })[0];
      if(expired && !confirm("この見積は有効期限が切れています。\n為替が動いて価格が合わなくなっている可能性があります。\n\n台帳に「期限切れの見積で受注した」と記録を残したうえで、受注にしますか？")) return;
      if(!expired && !confirm(esc(q.company) + " を受注にします。よろしいですか？\n（受注番号がつき、個体の行が数量ぶんできます）")) return;

      var ov = {};
      ["company_formal","dept","person","person_title","email","tel","bill_zip","bill_addr",
       "ship_name","ship_zip","ship_pref","ship_addr","ship_person","ship_tel","customer_po_no"].forEach(function(k){
        var v = val("of-" + k); if(v) ov[k] = v;
      });
      ov.payment_terms = el("of-payment_terms").value;
      var pp = el("pp-" + id); if(pp && pp.value) ov.po_path = pp.value;   // 注文書の置き場を台帳に残す
      var sh = val("of-shipping_jpy"); if(sh !== "") ov.shipping_jpy = Number(sh);
      var qty = {}, changed = false;
      q.items.forEach(function(i, n){
        var e = el("oq-" + id + "-" + n); if(!e) return;
        var v = Number(e.value);
        if(v && v !== i.qty){ qty[e.getAttribute("data-article")] = v; changed = true; }
      });
      if(changed) ov.qty = qty;

      b.disabled = true;
      act({ action:"create_order", request_id:id, override:ov, allow_expired:expired })
        .then(function(r){
          toast(r.created ? (r.order_no + " で受注にしました（" + r.units + "台・合計 " + yen(r.total_jpy) + "）")
                          : (r.message || "すでに受注になっています"));
          return reload();
        })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // ご請求書を作る（PDF＋Gmailの下書きまで。★送信はしない）
  root.querySelectorAll("[data-invoice]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-invoice"));
      var redo = b.getAttribute("data-redo")==="1";
      var o = D.ordered.filter(function(x){ return x.id===id; })[0] || {};
      var msg = redo
        ? "ご請求書を作り直します。\n\n・新しいPDFと下書きを作り、古い下書きは消します\n・すでにお客様へお送りしている場合は、差し替えのご連絡をお願いします\n\nよろしいですか？"
        : (o.company_formal || "") + " へのご請求書を作ります。\n\n・PDFを作り、Gmailの【下書き】に入れます\n・★送信はしません。Gmailで中身を見てから、ご自身で送ってください\n・この受注は「入金待ち」になります\n\nよろしいですか？";
      if(!confirm(msg)) return;
      b.disabled = true; var was = b.textContent; b.textContent = "作成中…（20秒ほど）";
      act({ action:"make_invoice", order_id:id, redo:redo })
        .then(function(r){
          toast("ご請求書 " + r.doc_no + " を作りました。★Gmailの下書きを確認して、ご自身で送信してください" +
                (r.old_draft_left ? "（古い下書きが消せませんでした。Gmailで古いほうを消してください）" : ""));
          return reload();
        })
        .catch(function(e){ b.disabled=false; b.textContent=was; toast(e.message, true); });
    });
  });

  // 先にPDFだけ見る（★台帳は一切変えない・下書きも作らない）
  root.querySelectorAll("[data-invprev]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-invprev"));
      b.disabled = true; var was = b.textContent; b.textContent = "作成中…";
      act({ action:"make_invoice", order_id:id, preview:true })
        .then(function(r){
          var bin = atob(r.pdf_base64), arr = new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
          var url = URL.createObjectURL(new Blob([arr], {type:"application/pdf"}));
          el("iv-" + id).innerHTML =
            '<div class="card" style="margin:10px 0 0"><div class="meta">' +
            '<span class="tag">下書きは作っていません</span> 見た目の確認用です</div>' +
            '<p class="note">お支払期限 ' + esc(r.due) + '　ご請求金額 ' + yen(r.total_jpy) + '　宛先 ' + esc(r.to) + '</p>' +
            '<div class="btns"><a class="btn pri" href="' + url + '" target="_blank" rel="noopener" ' +
            'style="text-decoration:none;display:inline-block">▶ ご請求書のPDFを開く</a></div></div>';
          b.disabled = false; b.textContent = was;
        })
        .catch(function(e){ b.disabled=false; b.textContent=was; toast(e.message, true); });
    });
  });

  // 状態を進める（入金を確認した／完了／キャンセル 等）
  root.querySelectorAll("[data-mark]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-mark")), what = b.getAttribute("data-what");
      var o = (D.ordered||[]).concat(D.cancelled||[]).filter(function(x){ return x.id===id; })[0] || {};
      var amt = yen((o.totals||{}).total_jpy);
      var msg = { "ご請求書を出した":"ご請求書を出したことを記録し、「入金待ち」にします。よろしいですか？",
                  "入金を確認した":"入金を確認したことを、今日の日付で記録します。よろしいですか？",
                  "JCへ発注メールを送った":"J-Certifiedへ発注メールを送ったことを記録します。\n発注番号は、インボイスが届いてから「JCの番号を入れる」で入れてください。\n\nよろしいですか？",
                  "完了にする":"この受注を完了にします。よろしいですか？",
                  "キャンセルする":"お客様都合のキャンセルとして記録します。\n※発注のあとはお受けできません（規約どおり）。\n\nよろしいですか？",
                  "在庫切れで中止する": (o.paid_on
                      ? "★この受注を中止します。\n\nすでに " + amt + " のご入金をいただいています。\n中止すると【全額返金】が必要になります（振込手数料も当社負担）。\n\nよろしいですか？"
                      : "この受注を中止します。まだ入金はありません。\nよろしいですか？"),
                  "返金した":"返金の振込が完了したことを、今日の日付で記録します。\n\n★本当に振り込みましたか？" }[what];
      if(!confirm(msg)) return;
      b.disabled = true;
      act({ action:"mark", order_id:id, what:what })
        .then(function(r){ toast(r.order_no + "：" + what + "（いまの状態＝" + r.status + "）"); return reload(); })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // 発注フォーム
  root.querySelectorAll("[data-jcform]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-jcform");
      var o = D.ordered.filter(function(x){ return String(x.id)===id; })[0];
      if(!o) return;
      var box = el("jc-" + id);
      box.innerHTML = jcForm(o); box.classList.remove("hidden"); b.disabled = true;
      wire();
    });
  });
  root.querySelectorAll("[data-closejc]").forEach(function(b){
    b.addEventListener("click", function(){ render(); });
  });
  root.querySelectorAll("[data-dojc]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-dojc"));
      var no = val("jc-no-" + id), tr = val("jc-tr-" + id), eta = val("jc-eta-" + id);
      if(!no && !tr && !eta){ toast("発注番号・追跡番号・到着予定日のうち、1つは入れてください", true); return; }
      b.disabled = true;
      act({ action:"jc_order", order_id:id, jc_order_no:no, tracking:tr, eta:eta||null })
        .then(function(r){ toast(r.order_no + "：番号を記録しました（" + r.units + "台）"); return reload(); })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // 検品
  root.querySelectorAll("[data-insp]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-insp")), result = b.getAttribute("data-result");
      var note = null;
      if(result==="NG"){
        note = prompt("どこが駄目でしたか？（例：型式が違う／外装に割れ）\nここに書いた内容が、Sの「要対応」に出ます。");
        if(note===null) return;
        if(!confirm("この1台をNGにします。出荷は止まり、Sの要対応に出ます。よろしいですか？")) return;
      }
      b.disabled = true;
      act({ action:"inspect", unit_id:id, result:result, serial:val("is-"+id), seal:val("ik-"+id), note:note })
        .then(function(r){ toast("検品 " + result + " を記録しました（" + r.order_no + "／残り" + r.remaining + "台）"); return reload(); })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // 出荷
  root.querySelectorAll("[data-doship]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-doship"));
      var ids = [];
      root.querySelectorAll('[data-ship="' + id + '"]').forEach(function(c){ if(c.checked) ids.push(Number(c.value)); });
      if(!ids.length){ toast("出荷する品物にチェックを入れてください", true); return; }
      var sno = val("sn-" + id);
      if(!sno){ toast("伝票番号を入れてください", true); return; }
      var o = D.shipping.filter(function(x){ return x.order_id===id; })[0];
      if(!confirm(o.company + " へ " + ids.length + "台を出荷済みにします。\n伝票番号 " + sno + "\n\nこの操作で保証の時計が動き出します。よろしいですか？")) return;
      b.disabled = true;
      act({ action:"ship", order_id:id, unit_ids:ids, carrier:el("sc-"+id).value, shipment_no:sno, delivered_on:val("sd-"+id)||null })
        .then(function(r){
          toast(r.order_no + "：" + r.shipped + "台を出荷済みにしました（保証の起算日 " + ymd(r.delivered_on) + "）" +
                (r.remaining ? "／まだ" + r.remaining + "台残っています" : ""));
          return reload();
        })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });
}

// ══════════════════════════════════════════════════════════════
//  入口（合言葉）
// ══════════════════════════════════════════════════════════════
function openApp(){ el("gate").classList.add("hidden"); el("app").classList.remove("hidden"); }

function submit(){
  var p = el("pass").value;
  el("err").textContent = "";
  load(p).then(function(d){
    try{ localStorage.setItem(PASSKEY, p); }catch(e){}
    D = d; openApp(); render();
  }).catch(function(e){
    el("err").textContent = (e.message==="bad-pass") ? "合言葉が違います" : "つながりませんでした（" + e.message + "）";
  });
}
el("go").addEventListener("click", submit);
el("pass").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });

// 覚えている合言葉で、そのときの最新を出す
function refresh(){
  var saved = getPass();
  if(saved) load(saved).then(function(d){ D=d; openApp(); render(); }).catch(function(){});
}
refresh();
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && D && !busy) refresh(); });
window.addEventListener("pageshow", function(e){ if(e.persisted && !busy) refresh(); });

})();
</script>
</body>
</html>
