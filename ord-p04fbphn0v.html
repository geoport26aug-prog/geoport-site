<style>

<script>
(function(){
"use strict";

// 受付係（Edge Function）の場所。データはここから届く。
var API = "https://vprtbkkqqdfidzvfwhzo.supabase.co/functions/v1/order-desk";
var K = new URLSearchParams(location.search).get("k") || "";
var PASSKEY = "geoport_order_desk_pass";   // 合言葉を覚えておく場所（この端末の中だけ）

var D = null;      // いま画面に出しているデータ
var TAB = null;    // いま開いているタブ
var busy = false;

// ── ちいさな道具 ───────────────────────────────────────────────
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function yen(n){ return "¥" + Number(n||0).toLocaleString("ja-JP"); }
function el(id){ return document.getElementById(id); }
function md(d){ if(!d) return ""; var p=String(d).slice(0,10).split("-"); return p[1]*1+"月"+p[2]*1+"日"; }
function ymd(d){ if(!d) return ""; var p=String(d).slice(0,10).split("-"); return p[0]+"年"+p[1]*1+"月"+p[2]*1+"日"; }
/* ★時刻（UTC）を「日本時間」に直す（2026-09-11 追加／2026-09-12 に時刻まで出せるよう一本化）。
   md() と ymd() は台帳の「日付だけ」の値（2026-09-11 のような文字列）用で、文字を切っているだけ。
   timestamptz（UTC）をそのまま切ると、日本の 00:00〜09:00 の出来事が**前日**として出て、
   時刻のほうは9時間ずれたまま出る。
   ⚠️この取り違えは過去に何度もやっている。**時刻（〜_at）には必ずこちらを使う。**
   ⚠️変換の式はこの1か所だけに置く（写しを作らない）。
     jstStr(ts) … "2026-09-12 08:30" ／ 日付だけ要るときは jstStr(ts).slice(0,10)
     ymdJ(ts)   … "2026年9月12日" */
function jstStr(ts){
  if(!ts) return "";
  var d = new Date(ts);
  if(isNaN(d.getTime())) return String(ts).slice(0,16).replace("T"," ");   // 読めない値はそのまま出す
  return d.toLocaleString("sv-SE", { timeZone: "Asia/Tokyo" }).slice(0,16);
}
function ymdJ(ts){ return ts ? ymd(jstStr(ts)) : ""; }
function val(id){ var e=el(id); return e ? e.value.trim() : ""; }

var toastTimer=null;
function toast(msg, bad){
  var t=el("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.className = bad ? "bad" : ""; t.textContent = msg; t.style.display="block";
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.style.display="none"; }, bad ? 9000 : 4000);
}

// ── 受付係とのやり取り ─────────────────────────────────────────
function getPass(){ try{ return localStorage.getItem(PASSKEY)||""; }catch(e){ return ""; } }
function load(pass){
  return fetch(API + "?k=" + encodeURIComponent(K), { headers:{ "x-view-pass": encodeURIComponent(pass) } })
    .then(function(r){
      if(r.status===401) throw new Error("bad-pass");
      if(!r.ok) throw new Error("err-" + r.status);
      return r.json();
    });
}

// ── 写真を縮めてから送る ──────────────────────────────────────
//   スマホの写真は1枚3〜8MBある。ラベルの文字を読むには長辺1600pxで十分。
//   ★縮めるのはブラウザの中。元の写真は端末から出ない（縮めたものだけ送る）。
function shrinkOne(file, maxSide, quality){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onerror = function(){ reject(new Error("写真を読めませんでした：" + file.name)); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("この写真は開けませんでした：" + file.name)); };
      img.onload = function(){
        var w = img.width, hgt = img.height, r = Math.min(1, maxSide / Math.max(w, hgt));
        var cw = Math.round(w * r), ch = Math.round(hgt * r);
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        var url = c.toDataURL("image/jpeg", quality);
        resolve({ media_type: "image/jpeg", data: url.slice(url.indexOf(",") + 1) });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function shrinkAll(files){
  if(!files.length) return Promise.resolve([]);
  return files.reduce(function(chain, f){
    return chain.then(function(acc){
      return shrinkOne(f, 1600, 0.72).then(function(p){ acc.push(p); return acc; });
    });
  }, Promise.resolve([]));
}

// ボタンを押したとき。★台帳を書き換えるので、返事を必ず確かめて、そのあと画面を作り直す。
function act(body){
  if(busy) return Promise.reject(new Error("busy"));
  busy = true;
  return fetch(API + "?k=" + encodeURIComponent(K), {
    method:"POST",
    headers:{ "x-view-pass": encodeURIComponent(getPass()), "content-type":"application/json" },
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ return {status:r.status, body:j}; }); })
    .then(function(res){
      if(res.status!==200 || res.body.ok===false) throw new Error(res.body && res.body.error ? res.body.error : "うまくいきませんでした");
      return res.body;
    })
    .finally(function(){ busy=false; });
}
function reload(){ return load(getPass()).then(function(d){ D=d; render(); }); }


/* ★故障品の買取の見込み（2026-09-11・S発案）
   お客様に売った製品と同じ型番の**故障品が客先にある**。JCが買い取るなら1件で2度の商売になる。
   ⚠️JCは**在庫の薄い型番しか買わない**ので、この印は出ないほうが普通（掲載の約半分）。
   ⚠️金額は**JCが当社に払う額**。お客様へ出す額ではない。いくら提示するかはSが決める。
   ⚠️送料の負担と査定の基準は**JCに未確認**（2026-09-11時点）。だから「見込み」としか書かない。 */
function buybackHtml(list){
  if(!list || !list.length) return "";
  var tot = list.reduce(function(a,b){ return a + Number(b.cashback_eur||0) * Number(b.qty||1); }, 0);
  return '<div class="meta" style="color:#0a6b3d">💰 <b>故障品の買取の見込み</b>　' +
    list.map(function(b){
      return esc(b.article) + " €" + Number(b.cashback_eur).toLocaleString() +
             (Number(b.qty)>1 ? "×" + b.qty + "台" : "");
    }).join("　／　") +
    (list.length>1 || Number(list[0].qty)>1 ? "　合計 €" + tot.toLocaleString() : "") +
    '<br><span style="color:var(--sub)">お客様の手元にある同じ型番の故障品を、JCがこの額で買い取る見込みです（当社が受け取る額）。' +
    '送料の負担と査定の基準はJCに確認中のため、まだお客様には提示しないでください。</span></div>';
}


/* ★JCのウェブショップで買うとき（2026-09-11）
   ウェブショップから買うと、メール発注のときJC側がしてくれていたすり合わせが無くなる。
   金額もこちらで見比べることになるので、「レジで見比べる1つの数字」を出す。
   ⚠️送料は1回の発送にかかる額。数量で掛けない（重量で決まる）。 */
function eur(v){ return "€" + Number(v).toFixed(2); }
function jcbuyHtml(list, refNo){
  if(!list || !list.length) return "";
  /* ★2026-09-13 修正：以前は「仕入値と送料が両方とれた品」だけに絞っており、
     在庫が0になった型番（jc_cost_eur / jc_ship_eur が null）では**帯ごと消えて商品ページの
     リンクも出なかった**。ウェブショップで在庫が戻ったか見たいのは、まさにその品。
     → 金額は出せるときだけ出し、**商品ページのリンクは常に出す**。 */
  var usable = list.filter(function(b){ return b.link || (b.cost_eur!=null && b.ship_eur!=null); });
  if(!usable.length) return "";
  var priced = usable.filter(function(b){ return b.cost_eur!=null && b.ship_eur!=null; });
  var many = priced.some(function(b){ return Number(b.qty)>1; }) || priced.length>1;
  var rows = usable.map(function(b){
    var has = (b.cost_eur!=null && b.ship_eur!=null);
    return '<div style="margin:2px 0">' + esc(b.article) + (Number(b.qty)>1 ? " ×" + b.qty : "") +
      (b.out_of_stock ? ' <span class="tag w">在庫なし</span>' : '') +
      (has
        ? '　仕入れ値 ' + eur(b.cost_eur) + ' ＋ 送料 ' + eur(b.ship_eur) +
          (Number(b.ship_eur)===0 ? '（€1,750以上で無料）' : '') +
          ' ＝ <b>' + eur(Number(b.cost_eur) + Number(b.ship_eur)) + '</b>'
        : '　<span style="color:var(--sub)">仕入れ値は在庫が戻るまで出ません（ページで在庫をご確認ください）</span>') +
      (b.link ? ' 　<a href="' + esc(b.link) + '" target="_blank" rel="noopener">商品ページ</a>' : '') +
      '</div>';
  }).join("");
  return '<div class="meta" style="color:#1d4ed8">🛒 <b>JCで買うとき</b>' +
    (refNo ? '　参照番号 <b>' + esc(refNo) + '</b> を Your reference に入れる' : '') +
    rows +
    '<span style="color:var(--sub)">' +
    (priced.length ? '★レジの金額がこの<b>合計</b>と違ったら、買う前にセールスチームに問い合わせてください。' : '') +
    (many ? '<br>⚠️数量が2以上・複数型番のときは、<b>送料はこの通りになりません</b>（重量でまとまるため）。商品代だけを見比べてください。' : '') +
    '</span></div>';
}

/* ★ファームウェアのバージョン確認（2026-09-11）
   流れ：①見積は止めない → ②JCへ確認（この画面から下書き）→ ③お客様へご連絡（同じくここから）
   🔴③に出すバージョンは、JCの原文をSが見て入力した値だけを使う（AIの読み取りを流し込まない）。 */
function fwHtml(q){
  var f = q.fw || {};
  if(!f.need) return "";
  var head = '<div class="meta" style="color:#92400e">🔧 <b>ファームウェアのバージョン確認が要る品です</b><br>';
  if(f.told_at){
    return head + 'バージョン <b>' + esc(f.answer||"") + '</b> を ' + ymdJ(f.told_at) + ' にお客様へご連絡済み。' +
      '<span style="color:var(--sub)">（言い直す場合は下の欄から作り直せます）</span>' + fwForm(q, f) + '</div>';
  }
  if(f.asked_at){
    return head + ymdJ(f.asked_at) + ' にJCへ問い合わせ済み。<b>返事待ち</b>。' +
      '<span style="color:var(--sub)">JCから返事が来たら、原文を確かめてバージョンを入力してください。</span>' + fwForm(q, f) + '</div>';
  }
  return head + 'まだJCに聞いていません。<span style="color:var(--sub)">お客様が注文する前に、出せるバージョンを確かめておきます。</span>' +
    '<div style="margin-top:6px"><button class="btn sec" data-fwask="' + q.request_id + '">JCにバージョンを聞く（下書き）</button></div></div>';
}
function fwForm(q, f){
  return '<div style="margin-top:6px">' +
    '<input id="fwv-' + q.request_id + '" type="text" placeholder="例 3.7" value="' + esc(f.answer||"") +
    '" style="width:120px;font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px">' +
    ' <button class="btn sec" data-fwtell="' + q.request_id + '">お客様にお知らせする（下書き）</button>' +
    ' <button class="btn" data-fwask="' + q.request_id + '" data-again="1">JCにもう一度聞く</button></div>';
}

// ══════════════════════════════════════════════════════════════
//  タブの組み立て
// ══════════════════════════════════════════════════════════════
function tabs(){
  var all = [
    // 2026-09-08：手動見積タブは外した（頻度が増えたら戻す。裏の仕組みとチャット操作は残る）。要対応は受注タブの先頭に出す。
    { id:"order",  name:"受注",     s_only:true,  count: D.quotable.length + D.ordered.length + (D.attention.length ? 0 : 0) },
    { id:"arrive", name:"到着待ち", s_only:false, count: D.arriving.length },
    { id:"insp",   name:"検品待ち", s_only:false, count: D.inspecting.reduce(function(a,o){return a+o.units.length;},0) },
    { id:"ship",   name:"出荷待ち", s_only:false, count: D.shipping.length },
    // 2026-09-11：SEOビュー（Sだけ）。中身は開いたときに取りに行く（画面表示を遅くしない）
    { id:"seo",    name:"SEO",      s_only:true,  count: (SEO && SEO.ledger && SEO.ledger.ok) ? SEO.ledger.v.quotes_28 : "–" }
  ];
  return all.filter(function(t){ return D.role==="s" || !t.s_only; });
}

function render(){
  var ts = tabs();
  if(!TAB || !ts.some(function(t){ return t.id===TAB; })) TAB = ts[0].id;

  el("who").textContent = (D.role==="s" ? "全部ページ" : "出荷ページ") + "／" + ymd(D.today) + " 現在";

  var nav = el("nav"); nav.innerHTML = "";
  ts.forEach(function(t){
    var b = document.createElement("button");
    b.className = (t.id===TAB ? "on" : "");
    b.innerHTML = esc(t.name) + '<span class="n">' + t.count + "</span>";
    b.addEventListener("click", function(){ TAB = t.id; render(); window.scrollTo(0,0); });
    nav.appendChild(b);
  });

  var h = "";
  if(TAB==="order")  h = paneOrder();
  if(TAB==="manual") h = paneManual();
  if(TAB==="attn")   h = paneAttention();
  if(TAB==="arrive") h = paneArriving();
  if(TAB==="insp")   h = paneInspect();
  if(TAB==="ship")   h = paneShip();
  if(TAB==="seo")    h = paneSeo();
  el("panes").innerHTML = '<section class="pane on">' + h + "</section>";
  el("loading").classList.add("hidden");
  wire();
}

function wireManual(root){
  if(!el("mq-basis")) return;
  if(el("mq-lastcust")) el("mq-lastcust").addEventListener("click", function(){
    var c = ((D.manual_quotes||[])[0]||{}).customer||{};
    ["company","attn","address","country","tax_id","email"].forEach(function(k){ if(el("mq-"+k)) el("mq-"+k).value = c[k]||""; });
  });
  el("mq-basis").addEventListener("click", function(){
    var b = el("mq-basis"); b.disabled = true;
    act(mqPayload("basis")).then(function(r){ el("mq-out").innerHTML = mqBasisHtml(r.basis, val("mq-currency")); })
      .catch(function(e){ toast(e.message, true); }).finally(function(){ b.disabled=false; });
  });
  el("mq-preview").addEventListener("click", function(){
    var b = el("mq-preview"); b.disabled = true; b.textContent = "作成中…";
    act(mqPayload("preview")).then(function(r){
      var bin = atob(r.pdf_base64), arr = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], {type:"application/pdf"}));
      el("mq-out").innerHTML = '<div class="card" style="margin:10px 0 0"><div class="meta"><span class="tag">下書きは作っていません</span> 見た目の確認用です</div>' +
        '<p class="note">宛先 ' + esc(r.to) + '　件名 ' + esc(r.subject) + '　合計 ' + esc(r.currency) + ' ' + Number(r.total).toLocaleString("en-US") + '　有効期限 ' + esc(r.valid_until) + '</p>' +
        '<div class="btns"><a class="btn pri" href="' + url + '" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">▶ 見積書のPDFを開く（2ページ）</a></div>' +
        '<details><summary>メール本文（英文）</summary><pre style="white-space:pre-wrap;font-size:12px">' + esc(r.body) + '</pre></details></div>' + mqBasisHtml(r.basis, r.currency);
    }).catch(function(e){ toast(e.message, true); }).finally(function(){ b.disabled=false; b.textContent="先にPDFを見る"; });
  });
  el("mq-create").addEventListener("click", function(){
    if(!confirm("英文の見積書PDFを作り、Gmailの下書き（添付つき）を作ります。送信はしません。よろしいですか？")) return;
    var b = el("mq-create"); b.disabled = true; b.textContent = "作成中…";
    act(mqPayload("create")).then(function(r){
      toast("下書きを作りました：" + r.quote_no + "（宛先 " + r.to + "）。Gmailの下書きを確認して送信してください。");
      return reload();
    }).catch(function(e){ toast(e.message, true); b.disabled=false; b.textContent="見積を作る（PDF＋Gmail下書き）"; });
  });
  root.querySelectorAll("[data-mqmark]").forEach(function(b){
    b.addEventListener("click", function(){
      var st = b.getAttribute("data-st");
      if(st==="失効" && !confirm("この見積を失効・取り下げにします。よろしいですか？")) return;
      act({ action:"manual_quote_mark", id:Number(b.getAttribute("data-mqmark")), status:st }).then(reload).catch(function(e){ toast(e.message, true); });
    });
  });
}

function paneOrder(){
  var h = "";

  // ══ ①要対応（あれば先頭に。別タブにしない）══════════════════════════
  //   2026-09-08 作り直し（S指示「画面がやや複雑」）：受注タブは「いま何がどこにあって、次は誰が何をするか」だけを見せる。
  //   ボタンは1件につき「次の1手」だけ。それ以外は「その他」に畳む（機能は減らさない＝iPhoneからも全部できる）。
  // 2026-09-09 S指摘「モリヤの枠だけで4つもある」：受注1件に関わる要対応（JC書類の確認・JCへの支払い）は
  //   別の枠にせず、その受注のカードの中に畳み込む。ここに残すのは、受注カードに結びつかないものだけ。
  var orderNos = {}; (D.ordered||[]).forEach(function(o){ orderNos[o.order_no] = o.id; });
  var attnByOrder = {}, attnRest = [];
  D.attention.forEach(function(a){
    var oid = a.order_id || orderNos[a.no];
    if(oid){ (attnByOrder[oid] = attnByOrder[oid] || []).push(a); } else attnRest.push(a);
  });
  if(attnRest.length){
    h += '<h2>要対応<span class="cnt">' + attnRest.length + "件</span></h2>";
    attnRest.forEach(function(a){
      h += '<div class="card ngc"><div class="top"><span class="co">' + esc(a.who||"") + '</span><span class="no">' + esc(a.no||"") + "</span></div>" +
           '<div class="meta"><span class="tag r">' + esc(a.kind) + "</span></div>" +
           '<p class="note">' + esc(a.detail).replace(/\n/g,"<br>") + "</p>" +
           (a.jc_mail_id ? '<div class="btns"><button class="btn ok" data-jcmail="' + a.jc_mail_id + '">確認した</button></div>' : "") +
           (String(a.key||"").indexOf("jcpay")===0 && a.order_id ? '<div class="btns"><button class="btn ok" data-jcpaid="' + a.order_id + '">JCに払った</button></div>' : "") +
           "</div>";
    });
  }

  // ══ ②見積を出した先（受注にできる）════════════════════════════════
  h += '<h2>見積を出した先<span class="cnt">' + D.quotable.length + "件</span></h2>";
  if(!D.quotable.length) h += '<div class="empty">いまは、返事待ちの見積はありません。</div>';
  var multi = D.quotable.length > 1;
  if(multi){
    h += '<details class="more" id="mergebox"><summary>同じお客様の見積を1つの受注にまとめる</summary>' +
      '<p class="note">下の見積の「まとめる」にチェックを付けると、請求書が1通・国内送料も1個口ぶんになります。</p>' +
      '<div id="mergeinfo"></div>' +
      '<div class="btns"><button class="btn pri" id="domerge" disabled>選んだ見積をまとめて受注にする</button></div></details>';
  }
  D.quotable.forEach(function(q){
    var pf = q.po_fields || {}, pw = q.po_warnings || [];
    h += '<div class="card' + (q.expired ? " warnc" : "") + '">' +
         '<div class="top"><span class="co">' + (q.po_received_at ? '📩 ' : '') + esc(q.company) + '</span><span class="no">' + esc(q.quote_no) + "</span></div>";
    q.items.forEach(function(i){
      h += '<div class="it"><span class="kata">' + esc(i.article) + "</span> × " + i.qty +
           '　<span class="sn">' + esc([i.brand, i.condition, "保証" + (i.warranty_years||1) + "年"].filter(Boolean).join("／")) + "</span></div>";
    });
    h += '<div class="meta">合計 <b>' + yen(q.total_jpy) + '</b>（税込・送料' + yen(q.ship_jpy) + (q.pref ? "・" + esc(q.pref) : "") + '）　' +
         (q.expired ? '<span class="tag w">有効期限切れ ' + ymd(q.valid_until) + '</span>' : '期限 ' + ymd(q.valid_until) + "（あと" + q.days_left + "日）") +
         (multi ? '　<label style="font-weight:400;font-size:12px;color:var(--sub)"><input type="checkbox" class="qsel" value="' + q.request_id +
                  '" data-mail="' + esc(q.email||"") + '" data-exp="' + (q.expired?"1":"0") + '" style="width:16px;height:16px;vertical-align:-3px"> まとめる</label>' : "") +
         '</div>';
    if(q.po_received_at){
      h += '<div class="next">📩 注文の返信が届いています（' + esc(jstStr(q.po_received_at)) + '）' +
           (pf.attachment_name ? '　注文書「' + esc(pf.attachment_name) + '」読み取り済み' : '　添付なし') +
           (pf.customer_po_no ? '　先方注番 ' + esc(pf.customer_po_no) : '') + '</div>';
      if(pf.intent_text) h += '<p class="note">本文：' + esc(pf.intent_text) + '</p>';
      if(pf.reply_text)  h += '<p class="note">返信：' + esc(pf.reply_text) + '</p>';
      pw.forEach(function(w){ h += '<p class="note" style="color:#b02a2a;font-weight:600">⚠️ ' + esc(w).replace(/\n/g,"<br>") + '</p>'; });
    } else {
      h += '<div class="next">次：お客様の返事待ち（返信が届くと自動でここに出ます）</div>';
    }
    h += fwHtml(q);
    h += jcbuyHtml(q.jcbuy, "");
    h += buybackHtml(q.buyback);
    if(q.expired) h += '<p class="note">為替で価格が動くため、再見積を出してから受注にしてください。どうしてもこの価格で受注する場合は、台帳に「期限切れの見積で受注した」と記録が残ります。</p>';
    h += '<div class="btns"><button class="btn ' + (q.expired ? "gray" : "pri") + '" data-openform="' + q.request_id + '">' +
         (q.expired ? "承知のうえで受注にする" : "受注にする") + "</button></div>" +
         '<div id="form-' + q.request_id + '" class="form hidden"></div></div>';
  });
  if(multi) h += '<div id="mergeform" class="form hidden"></div>';

  // ══ ③受注（進行中）＝1件1枚・進み具合の帯・次の1手 ═══════════════════
  h += '<h2>受注<span class="cnt">' + D.ordered.length + "件</span></h2>";
  if(!D.ordered.length) h += '<div class="empty">まだ進行中の受注はありません。</div>';

  var STEPS = ["受注","入金","発注","到着","検品","出荷","完了"];
  function stepIndex(o, inv){
    if(o.status==="完了") return 6;
    if(o.status==="出荷") return 5;
    if(o.status==="検品") return 4;
    if(o.status==="入荷") return 3;
    if(o.status==="発注") return 2;
    if(o.paid_on) return 1;                 // 入金済み → 次は発注
    return 0;                               // 受注（案内の発行〜入金待ち）
  }
  function stripHtml(idx){
    return '<div class="steps">' + STEPS.map(function(s,i){
      return '<span class="' + (i<idx ? "done" : i===idx ? "cur" : "") + '">' + (i<idx ? "●" : i===idx ? "◉" : "○") + s + '</span>';
    }).join("") + '</div>';
  }

  D.ordered.forEach(function(o){
    var t = o.totals || {};
    var inv = (o.documents||[]).filter(function(x){ return x.kind==="お支払いのご案内"||x.kind==="ご請求書"; })[0];
    var idx = stepIndex(o, inv);
    var early = (o.status==="受注" || o.status==="入金待ち");

    // ── 次の1手（文とボタン）。それ以外の操作は「その他」へ ──
    var next = "", primary = "", others = "";
    if(o.status==="受注" && !inv){
      next = "次：お支払いのご案内を作って送る（S）";
      primary = '<button class="btn pri" data-invoice="' + o.id + '">お支払案内を作る</button>';
      others += '<button class="btn sec" data-invprev="' + o.id + '">先にPDFを見る</button>';

               : '粗利およそ ' + w.tier_pct + '% → ' + w.margin_now + '%　差額 ' + yen(w.shortfall_jpy) + '（' + w.qty + '台ぶん）') + '</div>';

    var jcline = "";
    (function(){
      var seen = {}, list = [];
      (o.order_items||[]).forEach(function(i){ (i.order_units||[]).forEach(function(x){
        if(x.jc_purchases && !seen[x.jc_purchases.id]){ seen[x.jc_purchases.id]=1; list.push(x.jc_purchases); }
      }); });
      list.forEach(function(p){
        jcline += '<div class="meta"><span class="tag ' + (p.paid_on ? 'g' : 'r') + '">JC請求書 ' + esc(p.invoice_no) + '</span>' +

             '　EUR ' + Number(p.total_eur).toLocaleString("en-US",{minimumFractionDigits:2}) +
             '（商品 ' + Number(p.goods_eur).toLocaleString("en-US",{minimumFractionDigits:2}) + ' ＋送料 ' + Number(p.shipping_eur).toLocaleString("en-US",{minimumFractionDigits:2}) + '）' +
             (p.discount_pct!=null ? '　割引 ' + p.discount_pct + '%' : "") +
             (p.paid_on ? '　支払済 ' + md(p.paid_on) : '　<span style="color:#b23">★未払い' + (p.due_date ? '（期限 ' + md(p.due_date) + '）' : "") + '</span>') + '</div>';
      });
    })();
    // 仕入値の警告だけは畳まずに見せる（発注前に気づく必要がある）
    var alert = (o.price_watch||[]).some(function(w){ return w.gone || (w.margin_now !== null && w.margin_now < 20); });

    h += '<div class="card"><div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>";
    (o.order_items||[]).forEach(function(i){
      h += '<div class="it"><span class="kata">' + esc(i.article) + "</span> × " + i.qty + '　<span class="sn">' + yen(i.unit_price_jpy) + "／台・保証" + (i.warranty_years||1) + "年</span></div>";
    });
    h += '<div class="meta">合計 <b>' + yen(t.total_jpy) + '</b>' + (o.customer_po_no ? "　先方注番 " + esc(o.customer_po_no) : "") +
         (o.paid_on ? '　<span class="tag g">入金 ' + md(o.paid_on) + "</span>" : "") + '</div>';
    h += jcline;

    if(!o.ship_addr) h += '<p class="note"><span class="tag r">納品先が空</span> 出荷の前に住所を入れてください。</p>';
    // この受注に関わる要対応を、カードの中に畳み込む（JC書類の「確認した」だけ。支払いは「次の1手」に出るので重ねない）
    var mine = (attnByOrder[o.id]||[]).filter(function(a){ return a.jc_mail_id; });
    if(mine.length){
      h += '<div class="next" style="background:#fff4f4;border-left-color:var(--ng)">確認してください（' + mine.length + '件）';
      mine.forEach(function(a){
        var lines = String(a.detail||"").split("\n").filter(function(x){ return x && x.indexOf("押してください")<0; });
        h += '<div style="margin-top:6px;font-weight:400">' + esc(a.kind) + '<br><span style="color:var(--sub);font-size:12px">' + esc(lines.join("　")) + '</span>' +
             '<div class="btns" style="margin-top:4px"><button class="btn ok" data-jcmail="' + a.jc_mail_id + '">確認した</button></div></div>';
      });
      h += '</div>';
    }
    if(alert) h += '<p class="note" style="color:#b23;font-weight:600">⚠ 仕入値に注意があります（下の「その他」を開いてください）</p>';
    h += '<div class="next">' + esc(next || "次：機械が進めます") + '</div>';
    h += '<div class="btns">' + primary + '</div>';
    if(others || info){
      h += '<details class="more"><summary>その他（書類・仕入値・記録・取消）</summary>' + info +
           (others ? '<div class="btns">' + others + '</div>' : '') + '</details>';
    }
    h += '<div id="jc-' + o.id + '" class="form hidden"></div><div id="po-' + o.id + '"></div><div id="iv-' + o.id + '"></div></div>';
  });

  // ══ ④中止・おわった受注（畳む）═══════════════════════════════════
  var cx = D.cancelled || [], cl = D.closed || [];
  if(cx.length || cl.length){
    var needRefund = cx.some(function(o){ return o.paid_on && !o.refunded_on; });
    h += '<details class="more"' + (needRefund ? ' open' : '') + '><summary>中止 ' + cx.length + '件・おわった受注 ' + cl.length + '件</summary>';
    cx.forEach(function(o){
      var need = o.paid_on && !o.refunded_on;
      h += '<div class="card' + (need ? " ngc" : "") + '">' +
           '<div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>" +
           '<div class="meta"><span class="tag r">中止</span> 合計 ' + yen((o.totals||{}).total_jpy) +
           (o.paid_on ? "　入金 " + md(o.paid_on) : "　入金なし") +
           (o.refunded_on ? '　<span class="tag g">返金 ' + md(o.refunded_on) + "</span>" : "") + "</div>";
      if(need){
        h += '<p class="note">★<b>全額を返金してください。振込手数料も当社負担です</b>（規約どおり）。返金の振込が済んだら押してください。</p>' +
             '<div class="btns"><button class="btn ok" data-mark="' + o.id + '" data-what="返金した">返金した</button></div>';
      }
      h += "</div>";
    });
    cl.forEach(function(o){
      h += '<div class="card"><div class="top"><span class="co">' + esc(o.company_formal) + '</span><span class="no">' + esc(o.order_no) + "</span></div>" +
           '<div class="meta"><span class="tag">' + esc(o.status) + "</span> 合計 " + yen((o.totals||{}).total_jpy) + "</div></div>";
    });
    h += '</details>';
  }

  // ══ ⑤JCとの約束（一番下に1行）═══════════════════════════════════
  (function(){
    var j = D.jc_progress; if(!j) return;
    var eur = function(n){ return "€" + Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0}); };
    var pct = Math.min(100, Math.round(Number(j.商品計_eur) / Number(j.目標_eur) * 100));
    h += '<h2>JCとの約束<span class="cnt">' + eur(j.商品計_eur) + ' / €50,000（' + pct + '%）・残り ' + j.残り日数 + '日</span></h2>' +
         '<div class="card"><div style="height:10px;background:#e8eef5;border-radius:5px;overflow:hidden;margin:2px 0 8px">' +
           '<div style="height:100%;width:' + Math.max(pct,1) + '%;background:var(--navy)"></div></div>' +
         '<div class="note" style="margin:0">あと ' + eur(j.残り_商品のみ) + '（月 ' + eur(j.月あたり必要_商品のみ) + '）　期限 ' + esc(j.期限) +
         (Number(j.未払い_eur) > 0 ? '　<span style="color:#b23">JCへ未払い ' + eur(j.未払い_eur) + '</span>' : "") + '</div></div>';
  })();

  return h;
}

  var p = null;
  (o.order_items||[]).forEach(function(i){ (i.order_units||[]).forEach(function(x){ if(!p && x.jc_purchases) p = x.jc_purchases; }); });
  return p;

  var t = null;
  (o.order_items||[]).forEach(function(i){ (i.order_units||[]).forEach(function(x){ if(!t && x.inbound_tracking) t = x.inbound_tracking; }); });
  return t;
}

//   ★数字を並べた画面にしない。**じょうご**にする。
//     検索に出る → 押される → サイトに来る → **見積依頼が来る**
//     いちばん大事なのは最後の「見積依頼」。上の数字はその原因。順番に意味がある。
//   ★社内（Sと Claude）とボットは除いた数字（2026-09-10 の除外の仕組み）。
//     Googleの検索結果だけは除外できないので、自社名の検索語を除いている。
// ══════════════════════════════════════════════════════════════
var SEO = null, SEO_LOADING = false;

function seoLoad(){
  if(SEO_LOADING) return; SEO_LOADING = true;
  act({action:"seo"}).then(function(r){ SEO = r; }).catch(function(e){
    SEO = { error: e.message };
  }).finally(function(){ SEO_LOADING = false; render(); });
}

function pct(now, prev){
  // ★母数が小さいときに率を出さない（2回→344回を「+17100%」と書いても意味がない）。
  //   下の行に前の28日の実数を必ず載せているので、そちらを見てもらう。
  if(prev < 10) return now > prev ? '<span class="tag g">増えた</span>'
                : (now < prev ? '<span class="tag w">減った</span>' : "");
  var d = Math.round((now/prev - 1) * 100);
  if(d === 0) return '<span class="tag">±0%</span>';
  return '<span class="tag ' + (d>0 ? "g" : "w") + '">' + (d>0?"+":"") + d + "%</span>";
}

function seoBox(title, inner){ return '<h2>' + title + '</h2><div class="card">' + inner + "</div>"; }

function paneSeo(){

// ══════════════════════════════════════════════════════════════
//  ボタンをつなぐ
// ══════════════════════════════════════════════════════════════
function wire(){
  var root = el("panes");
  wireManual(root);

  // SEOタブの「取り直す」（2026-09-11）
  root.querySelectorAll("[data-seoreload]").forEach(function(b){
    b.addEventListener("click", function(){ SEO = null; render(); });
  });

  // 受注フォームを開く／閉じる
  root.querySelectorAll("[data-openform]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-openform");
      var q = D.quotable.filter(function(x){ return String(x.request_id)===id; })[0];
      var box = el("form-" + id);
      box.innerHTML = orderForm(q); box.classList.remove("hidden"); b.disabled = true;
      // ★自動取り込みで読み取り済みなら、入力欄と注文書の置き場を先に入れる（中身の確認はSがする）
      if(q.po_fields){
        Object.keys(q.po_fields).forEach(function(k){ var e = el("of-" + k); if(e && q.po_fields[k] && typeof q.po_fields[k]==="string") e.value = q.po_fields[k]; });
        var pp = el("pp-" + id); if(pp && q.po_path) pp.value = q.po_path;
      }
      wire();
    });
  });
  root.querySelectorAll("[data-closeform]").forEach(function(b){
    b.addEventListener("click", function(){ render(); });
  });

  // ── まとめる：チェックが変わるたびに、送料の目安を出し直す ──────────
  function selectedQuotes(){
    var out=[];
    root.querySelectorAll(".qsel").forEach(function(c){
      if(c.checked) out.push({ id:Number(c.value), mail:c.getAttribute("data-mail"),
                               exp:c.getAttribute("data-exp")==="1" });
    });
    return out;
  }
  var estTimer=null;
  function refreshMerge(){
    var sel = selectedQuotes(), info = el("mergeinfo"), btn = el("domerge");
    if(!info || !btn) return;
    if(sel.length < 2){
      info.innerHTML = ""; btn.disabled = true;

      var p = o ? jcPurchaseOf(o) : null;
      if(!p){ toast("この受注にJCの請求書が見つかりません", true); return; }
      if(!confirm("JCの請求書 " + p.invoice_no + "（EUR " + Number(p.total_eur).toLocaleString("en-US",{minimumFractionDigits:2}) + "）を支払ったことを、今日の日付で記録します。\n\n★本当に支払いましたか？")) return;
      b.disabled = true;
      act({ action:"jc_order", order_id:id, invoice_no:p.invoice_no, paid_on:D.today, payment_method:p.payment_method || "支払いリンク" })
        .then(function(r){ toast(r.order_no + "：JCへの支払いを記録しました（" + D.today + "）"); return reload(); })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // 発注フォーム
  root.querySelectorAll("[data-jcform]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-jcform");
      var o = D.ordered.filter(function(x){ return String(x.id)===id; })[0];
      if(!o) return;
      var box = el("jc-" + id);
      box.innerHTML = jcForm(o); box.classList.remove("hidden"); b.disabled = true;
      wire();
    });
  });
  root.querySelectorAll("[data-closejc]").forEach(function(b){
    b.addEventListener("click", function(){ render(); });
  });
  root.querySelectorAll("[data-dojc]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-dojc"));
      function g(k){ return val("jc-" + k + "-" + id); }
      var body = { action:"jc_order", order_id:id,
        invoice_no:g("inv"), sales_order_no:g("so"), invoice_date:g("idate"),
        due_date:g("due"), delivery_date:g("ddate"),
        goods_eur:g("goods"), shipping_eur:g("ship"), vat_eur:g("vat"), total_eur:g("tot"),
        discount_pct:g("disc"), payment_method:g("pm"), paid_on:g("paid"),
        tracking:g("tr"), eta:g("eta") };
      if(!body.invoice_no && !body.tracking && !body.eta){
        toast("請求書番号・追跡番号・到着予定日のうち、1つは入れてください", true); return; }
      b.disabled = true;
      act(body)
        .then(function(r){
          toast(r.order_no + "：" + (r.invoice_no ? "請求書 " + r.invoice_no + " を記録しました（EUR " + r.total_eur + "）"
                                                 : "追跡番号を記録しました"));
          return reload();
        })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });

  // 検品
  root.querySelectorAll("[data-insp]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-insp")), result = b.getAttribute("data-result");
      var note = null;
      if(result==="NG"){
        note = prompt("どこが駄目でしたか？（例：型式が違う／外装に割れ）\nここに書いた内容が、Sの「要対応」に出ます。");
        if(note===null) return;
        if(!confirm("この1台をNGにします。出荷は止まり、Sの要対応に出ます。よろしいですか？")) return;
      }
      var files = (el("ip-" + id) && el("ip-" + id).files) ? [].slice.call(el("ip-" + id).files) : [];
      if(files.length > 4){ toast("写真は4枚までにしてください", true); return; }
      b.disabled = true; var was = b.textContent;
      b.textContent = files.length ? "写真を送っています…" : "記録中…";
      shrinkAll(files)
        .then(function(photos){
          return act({ action:"inspect", unit_id:id, result:result,
                       serial:val("is-"+id), seal:val("ik-"+id), note:note, photos:photos });
        })
        .then(function(r){
          var msg = "検品 " + result + " を記録しました（" + r.order_no + "／残り" + r.remaining + "台）";
          if(r.photos) msg += "／写真" + r.photos + "枚";
          if(r.mismatches && r.mismatches.length){
            // ★食い違いは黙って決めない。その場で見せ、Sの要対応にも出る。
            alert("★番号が写真と食い違っています。記録はしましたが、Sに確認が回ります。\n\n"
                  + r.mismatches.join("\n")
                  + "\n\n打った番号はそのまま残してあります（機械の読みで上書きしていません）。");
          } else if(r.ai_error){
            msg += "／★写真の読み取りはできませんでした（写真は保存済み）";
          }
          toast(msg);
          return reload();
        })
        .catch(function(e){ b.disabled=false; b.textContent=was; toast(e.message, true); });
    });
  });

  // 出荷
  root.querySelectorAll("[data-doship]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = Number(b.getAttribute("data-doship"));
      var ids = [];
      root.querySelectorAll('[data-ship="' + id + '"]').forEach(function(c){ if(c.checked) ids.push(Number(c.value)); });
      if(!ids.length){ toast("出荷する品物にチェックを入れてください", true); return; }
      var sno = val("sn-" + id);
      if(!sno){ toast("伝票番号を入れてください", true); return; }
      var o = D.shipping.filter(function(x){ return x.order_id===id; })[0];
      if(!confirm(o.company + " へ " + ids.length + "台を出荷済みにします。\n伝票番号 " + sno + "\n\nこの操作で保証の時計が動き出します。よろしいですか？")) return;
      b.disabled = true;
      act({ action:"ship", order_id:id, unit_ids:ids, carrier:el("sc-"+id).value, shipment_no:sno, delivered_on:val("sd-"+id)||null })
        .then(function(r){
          toast(r.order_no + "：" + r.shipped + "台を出荷済みにしました（保証の起算日 " + ymd(r.delivered_on) + "）" +
                (r.remaining ? "／まだ" + r.remaining + "台残っています" : ""));
          return reload();
        })
        .catch(function(e){ b.disabled=false; toast(e.message, true); });
    });
  });
}

// ══════════════════════════════════════════════════════════════
//  入口（合言葉）
// ══════════════════════════════════════════════════════════════
function openApp(){ el("gate").classList.add("hidden"); el("app").classList.remove("hidden"); }

function submit(){
  var p = el("pass").value;
  el("err").textContent = "";
  load(p).then(function(d){
    try{ localStorage.setItem(PASSKEY, p); }catch(e){}
    D = d; openApp(); render();
  }).catch(function(e){
    el("err").textContent = (e.message==="bad-pass") ? "合言葉が違います" : "つながりませんでした（" + e.message + "）";
  });
}
el("go").addEventListener("click", submit);
el("pass").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });

// 覚えている合言葉で、そのときの最新を出す
function refresh(){
  var saved = getPass();
  if(saved) load(saved).then(function(d){ D=d; openApp(); render(); }).catch(function(){});
}
refresh();

// ★画面そのもの（このHTML）が新しくなっていたら読み直す（2026-09-09・S「画面が変化していません」）
//   ホーム画面に置いたアプリは、アプリを完全に終了するまで古いHTMLを持ち続ける。データは refresh() で新しくなるが、
//   ボタンや文言は古いまま。→ 前に出たときにサーバーの版（ETag）を見比べ、違えば1回だけ読み直す。
var PAGE_TAG = null;
function checkPageVersion(){
  fetch(location.pathname, { method:"HEAD", cache:"no-store" }).then(function(r){
    var tag = r.headers.get("etag") || r.headers.get("last-modified") || "";
    if(!tag) return;
    if(PAGE_TAG === null){ PAGE_TAG = tag; return; }
    if(tag !== PAGE_TAG && !busy){ PAGE_TAG = tag; location.reload(); }
  }).catch(function(){});
}
checkPageVersion();
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible" && D && !busy){ checkPageVersion(); refresh(); } });
window.addEventListener("pageshow", function(e){ if(e.persisted && !busy){ checkPageVersion(); refresh(); } });

})();
</script>
